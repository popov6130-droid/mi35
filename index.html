<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1012"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ми-35М — системы в 3D</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Ми‑35М">
<style>
:root{color-scheme:dark;
--bg:#0b1012;--bg2:#0f1618;--surf:#151d20;--surf2:#1c2629;--surf3:#243134;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
--ink:#e9f0f0;--ink2:#a2b3b4;--ink3:#6f8284;--amber:#f2b01e;--amber2:#ffc94a;--amber-ink:#1d1500;--red:#ff5a4e;--green:#3ccf7a;--blue:#5aa9ff;
--r:16px;--r2:12px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 14px 8px;background:var(--bg)}
.logo{font-weight:700;font-size:17px;letter-spacing:.01em;white-space:nowrap}
.logo b{color:var(--amber);font-weight:700}
.syspick{margin-left:auto;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--line2);font-weight:600;font-size:15px;max-width:62%}
.syspick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syspick svg{flex:none;opacity:.7}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)}

/* segmented modes */
.seg{display:flex;gap:4px;margin:0 14px 8px;padding:4px;background:var(--surf);border:1px solid var(--line);border-radius:14px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;padding:0 4px}
.seg button.on{background:var(--surf3);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 8px rgba(0,0,0,.35)}

/* 3D stage */
.stage{position:relative;flex:1;min-height:0;margin:0 10px;border-radius:20px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#1b2a2d 0,#0c1214 100%);border:1px solid var(--line)}
#wrap{position:absolute;inset:0}
#cv{width:100%;height:100%;display:block;touch-action:none}
.fabs{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.fab{width:44px;height:44px;border-radius:14px;background:rgba(21,29,32,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--ink)}
.fab:active{transform:scale(.94)}
.fab.on{color:var(--amber)}
.fab svg{width:20px;height:20px}
.viewmenu{position:absolute;right:58px;top:8px;z-index:4;background:rgba(21,29,32,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:14px;padding:4px;display:flex;flex-direction:column;min-width:130px}
.viewmenu button{min-height:44px;text-align:left;padding:0 14px;border-radius:10px;font-size:15px}
.viewmenu button:active{background:var(--surf3)}
.hint{position:absolute;left:12px;top:10px;right:64px;font-size:12px;color:var(--ink3);pointer-events:none;z-index:2;transition:opacity .6s}

/* bottom sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(17,24,27,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;height:var(--sh,40%);transition:height .28s cubic-bezier(.2,.8,.2,1)}
.sheet.drag{transition:none}
.grab{flex:none;height:26px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line2)}
.sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(14px + var(--sab));overscroll-behavior:contain}
#tab{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
#tab::-webkit-scrollbar{display:none}
#tab:empty{display:none}
.tb{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:6px 8px;border-radius:6px;border:1px solid #2a3537;color:#5f7071;background:#141c1e;text-align:center;line-height:1.15;white-space:nowrap}
.tb.g.lit{background:#147a39;color:#eaffea;border-color:#4be07f;box-shadow:0 0 8px rgba(47,184,90,.6)}
.tb.y.lit{background:#a67c00;color:#fff7d6;border-color:#ffd23a;box-shadow:0 0 8px rgba(224,176,32,.6)}
.tb.r.lit{background:#a81e1e;color:#ffecec;border-color:#ff6a6a;box-shadow:0 0 8px rgba(224,58,58,.6)}
.tb.z{background:#0d1c22;color:#9fe0e0;border-color:#2c5a5e;font-weight:600}

/* info card (step / component / quiz) */
#ov{background:var(--surf2);border:1px solid var(--line2);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px;position:relative}
#ov::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
#ovT{font-weight:700;font-size:17px;line-height:1.3;margin:0 36px 6px 0}
#ovB{font-size:15px;line-height:1.5;color:var(--ink2)}
#ovB b{color:var(--ink);font-weight:600}
#ovX{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:12px;color:var(--ink3);font-size:18px;display:grid;place-items:center}
#ovN{display:flex;align-items:center;gap:8px;margin:12px -14px -12px;padding:10px 14px 12px;position:sticky;bottom:calc(-14px - var(--sab));background:var(--surf2);border-radius:0 0 var(--r) var(--r);z-index:2}
#ovN span{flex:1;text-align:center;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prog{height:4px;border-radius:2px;background:var(--surf3);margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .3s}

/* buttons, chips, lists */
.bt{min-height:44px;padding:0 16px;border-radius:12px;background:var(--surf3);border:1px solid var(--line2);font-weight:600;font-size:15px;color:var(--ink)}
.bt.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.bt:disabled{opacity:.35}
.bt.ok{background:rgba(60,207,122,.16);border-color:var(--green);color:#bff5d4}
.bt.no{background:rgba(255,90,78,.14);border-color:var(--red);color:#ffd2ce}
.bt.li{width:100%;text-align:left;padding:12px 14px;line-height:1.35;min-height:48px;font-weight:500}
.bt.sm2{min-height:36px;padding:0 12px;font-size:13.5px;font-weight:500;border-radius:999px;background:var(--surf);}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 2px 8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surf);border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sub{min-height:34px;font-size:13px;font-weight:500}.chip.sub.on{background:var(--surf3);color:var(--ink);border-color:var(--amber)}
.col{display:flex;flex-direction:column;gap:6px}
.list .bt.li{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border-color:var(--line)}
.list .bt.li.on{background:rgba(242,176,30,.12);border-color:rgba(242,176,30,.6);color:var(--ink)}
.list .n{flex:none;min-width:24px;height:24px;border-radius:8px;background:var(--surf3);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink2)}
.list .on .n{background:var(--amber);color:var(--amber-ink)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.sm{font-size:14px;color:var(--ink2)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin:0 12px 6px 0}
.lg i{width:18px;height:5px;border-radius:3px;display:inline-block}
details.leg summary{list-style:none;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:14px 2px 8px}
details.leg summary::-webkit-details-marker{display:none}
details.leg summary::after{content:" ▾"}
details.leg[open] summary::after{content:" ▴"}
.note{color:var(--ink3);font-size:12.5px;margin:16px 2px 0}
.okT{color:var(--green);font-weight:700;margin-top:12px}.badT{color:var(--red);font-weight:700;margin-top:12px}
#qz .col{margin-top:10px}

/* reading pages (theory / numbers) */
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(24px + var(--sab));overscroll-behavior:contain}
.h1{font-size:26px;font-weight:700;line-height:1.2;margin:6px 2px 12px}
.theory{font-size:16px;line-height:1.6;color:var(--ink);max-width:70ch}
.theory h2{font-size:19px;line-height:1.3;margin:24px 0 8px}
.theory p{margin:8px 0}
.theory ol,.theory ul{padding-left:22px;margin:8px 0}.theory li{margin:6px 0}
.theory b{color:#fff}
.theory .card{padding:6px 14px;margin:10px 0}
.theory table{border-collapse:collapse;width:100%;font-size:15px}.theory td{border-top:1px solid var(--line);padding:9px 4px;vertical-align:top}.theory tr:first-child td{border-top:none}.theory td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px}

/* numbers trainer */
.nstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.nstat div{background:var(--surf);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}
.nstat b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.nstat span{font-size:12px;color:var(--ink3)}
.qcard{background:var(--surf2);border:1px solid var(--line2);border-radius:20px;padding:18px 16px 16px;margin-top:12px}
.qsys{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.qtext{font-size:20px;font-weight:700;line-height:1.3;margin:10px 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;border-radius:14px;background:var(--surf);border:1px solid var(--line2);font-size:17px;font-weight:600;text-align:left;padding:10px 16px;display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--surf3);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.opt:active{transform:scale(.99)}
.opt.ok{background:rgba(60,207,122,.16);border-color:var(--green)}.opt.ok .k{background:var(--green);color:#03210f}
.opt.no{background:rgba(255,90,78,.14);border-color:var(--red)}.opt.no .k{background:var(--red);color:#2a0300}
.opt:disabled{cursor:default}
.inp{display:flex;gap:8px}
.inp input{flex:1;min-width:0;min-height:56px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);font:600 22px/1 var(--font);padding:0 16px;font-variant-numeric:tabular-nums}
.inp input:focus{outline:none;border-color:var(--amber)}
.inp input.ok{border-color:var(--green)}.inp input.no{border-color:var(--red)}
.unit{font-size:13px;color:var(--ink3);margin:8px 2px 0}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.45}
.fb.ok{background:rgba(60,207,122,.12);color:#c9f7da}.fb.no{background:rgba(255,90,78,.12);color:#ffd5d1}
.fb b{color:#fff}
.acts{display:flex;gap:8px;margin-top:12px}.acts .bt{flex:1;min-height:52px}
.weak{margin-top:18px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.kp button{min-height:52px;border-radius:12px;background:var(--surf);border:1px solid var(--line2);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.kp button:active{background:var(--surf3)}
.kp small{display:block;font-size:10px;font-weight:600;color:var(--ink3);margin-top:-2px}
.kp .go{grid-column:span 2;background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-size:16px}

/* tab bar */
.tabbar{flex:none;display:flex;padding:6px 8px calc(6px + var(--sab));background:var(--bg);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;color:var(--ink3);font-size:11.5px;font-weight:600;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--amber)}

/* system picker */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;animation:fd .2s}
.mbox{width:100%;max-height:86%;overflow-y:auto;background:var(--surf);border-radius:24px 24px 0 0;padding:8px 14px calc(16px + var(--sab));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.mbox h3{font-size:18px;margin:6px 4px 12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:76px;padding:12px;border-radius:16px;background:var(--surf2);border:1px solid var(--line);text-align:left}
.sgrid button.on{border-color:var(--amber);background:rgba(242,176,30,.1)}
.sgrid b{font-size:15px}.sgrid span{font-size:12.5px;color:var(--ink3);line-height:1.3}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}

/* fullscreen 3D */
body.fs .top,body.fs .seg,body.fs .tabbar{display:none}
body.fs .stage{margin:0;border-radius:0;border:0}
body.fs .fabs{top:calc(8px + var(--sat))}
@media (min-width:760px){.stage{margin:0 16px}.seg,.top{max-width:none}.sheet{left:auto;width:420px;right:12px;bottom:12px;border-radius:22px;height:calc(var(--sh,40%) - 12px)}.scroll{padding-left:max(14px,calc(50% - 380px));padding-right:max(14px,calc(50% - 380px))}}

/* Технический атлас */
:root{
  --bg:#101718;--bg2:#0b1213;--surf:#182325;--surf2:#1c2a2a;--surf3:#243634;
  --line:#2b3b39;--line2:#3d514d;--ink:#f1f7f4;--ink2:#b6c7bf;--ink3:#9bafa7;
  --amber:#82ffcf;--amber2:#acf9d9;--amber-ink:#092319;
}
.top{padding-inline:16px;min-height:56px}
.logo{font-size:16px;color:var(--ink2)}
.logo b{display:none}
.syspick{min-height:44px;padding-inline:12px;font-size:13px}
.scene-header{margin:0 16px 10px}
.scene-header h1{font-size:clamp(26px,7vw,34px);line-height:1.08;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}
.scene-header p{font-size:13px;color:var(--ink2);margin:4px 0 0}
.scene-bar{margin:0 16px 9px;display:grid;gap:7px}
.scene-bar .seg{margin:0;border-radius:11px;background:none;border:0;padding:0;gap:5px}
.scene-bar .seg button{background:var(--surf);border:1px solid var(--line);min-height:42px;border-radius:9px}
.scene-bar .seg button.on,.hull-controls button[aria-pressed="true"]{background:#19362c;color:var(--amber);border-color:#4e9b7d;box-shadow:none}
.hull-controls{display:flex;gap:5px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--bg2)}
.hull-controls button{flex:1;min-height:38px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:700;color:var(--ink2)}
.stage{
  margin:0 12px;border-color:#2b3e39;
  background:radial-gradient(circle,rgba(147,193,178,.18) .75px,transparent 1px) 0 0/20px 20px,
             radial-gradient(90% 80% at 49% 37%,#142421,#0b1112 76%);
}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(6,12,13,.34),transparent 55%)}
.sheet{background:rgba(20,31,32,.97);border-color:#3a5049;box-shadow:0 -8px 28px #0005}
.stage.exterior .sheet{display:none}
.fabs{right:7px;top:7px;gap:4px;flex-direction:row}
.viewmenu{top:56px;right:7px}
.fab{width:44px;height:44px;border-radius:10px;background:rgba(20,32,32,.88)}
.hint{left:10px;right:10px;top:59px;color:var(--ink3);font-size:11.5px;line-height:1.3}
.chip.on{background:#19362c;color:var(--amber);border-color:#4e9b7d}
.chip.sub.on{background:#19362c;color:var(--amber)}
.list .bt.li.on,.sgrid button.on{background:#19362c;border-color:#4e9b7d}
.tabbar{margin:8px 12px 0;padding:5px 6px calc(6px + var(--sab));border:1px solid var(--line);border-radius:17px 17px 0 0;background:var(--surf);gap:4px}
.tabbar button{min-height:49px}
.tabbar button.on{background:#19362c;color:var(--amber)}
.tabbar button svg{width:20px;height:20px}
.scroll{padding-inline:16px}
.h1{font-size:34px;letter-spacing:-.035em}
.theory{max-width:70ch;line-height:1.65}
.theory h2{font-size:22px;color:var(--ink)}
.theory-hero{padding:16px;border:1px solid var(--line2);background:var(--surf);border-radius:16px}
.theory-hero h2{margin-top:0}
.theory-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.theory-actions .bt{padding:0 11px;font-size:13px}
.theory table{table-layout:fixed}
.theory td:first-child{overflow-wrap:anywhere}
.theory td:last-child{width:33%;white-space:normal;font-variant-numeric:tabular-nums}
.qcard{background:var(--bg);border:1px solid var(--line);border-radius:17px}
.qtext{font-size:clamp(20px,5.7vw,27px);letter-spacing:-.025em;line-height:1.23}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:68px;padding:7px 8px;gap:7px;line-height:1.35;overflow-wrap:anywhere}
.opt .k{width:24px;height:24px;align-self:flex-start}
.opt.ok{background:#19362c;border-color:#82ffcf}
.opt.ok .k{background:#82ffcf;color:var(--amber-ink)}
.nstat div{padding:8px 9px}
.nstat b{font-size:21px}
body.fs .scene-header,body.fs .scene-bar{display:none}
@media (min-width:760px){
  .scene-header,.scene-bar{margin-inline:20px}
  .scene-bar{grid-template-columns:2fr 1fr;max-width:645px}
  .stage{margin-inline:16px}
  .scroll{padding-inline:max(16px,calc(50% - 380px))}
  .tabbar{align-self:center;width:min(calc(100% - 32px),660px)}
}
@media (max-height:720px){
  .top{min-height:47px;padding-bottom:5px}
  .scene-header{margin-bottom:7px}
  .scene-header h1{font-size:24px}
  .scene-header p{display:none}
  .scene-bar{gap:4px;margin-bottom:5px}
  .scene-bar .seg button,.hull-controls button{min-height:34px}
  .fabs{gap:2px}
  .fab{width:36px;height:36px}
  .hint{top:48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style></head><body>
<div id="app">
<!-- 3D -->
<section class="page" id="p3d">

{n:'ВСУ ТА-14-130-35В',p:[2.55,1.75,0],lp:[2.55,2.1,0],m:1,s:'ВСУ',i:'Питается из любого расходного бака через узел обратных клапанов, электромагнитный клапан 610200 и фильтр тонкой очистки.'},
{n:'Насосный агрегат',p:[.9,1.15,0],m:1,s:'Насосный агрегат',lp:[.9,1.45,0],i:'Два струйных (эжекторных) насоса и управляющий диафрагменный клапан. Стоит над баком № 3. Рабочее топливо из расходных баков проходит через сопла, создаёт разрежение и подсасывает топливо из ПТБ в бак № 3. Движущихся частей и электропитания нет.'},
{n:'Узел обратных клапанов',p:[.3,1.1,0],m:0,i:'Отдаёт топливо на ВСУ и на насосный агрегат из любого расходного бака. Не даёт топливу перетекать из магистрали левого двигателя в правую и обратно. На нём стоят два сигнализатора давления СДУ-2А-0,18.'},
{n:'Клапанная коробка',p:[-.2,1.1,0],m:0,i:'Два подпружиненных перепускных клапана навстречу друг другу. Если давление за подкачивающими насосами различается больше чем на 0,25 кгс/см², перепускает топливо в магистраль с меньшим давлением: расходные баки вырабатываются равномерно. При отказе одного насоса питает оба двигателя от одного бака.'},
{n:'Пожарный кран (левый)',p:[-1.631,1.249,.54],m:0,i:'Перекрывной кран 768600МА в магистрали подачи к двигателю. Управление электрическое, с пульта топливной системы. Закрывают при пожаре или выключении двигателя.'},
{n:'Пожарный кран (правый)',p:[-1.631,1.249,-.54],m:0,i:'Перекрывной кран 768600МА в магистрали подачи к правому двигателю. Закрытый кран останавливает двигатель — не перепутай сторону.'},

{n:'Подкачивающий насос ЭЦН-91С (бак 1)',p:[.5,1.1,.6],m:0,i:'Центробежный электронасос внизу расходного бака. Подаёт топливо к двигателю, ВСУ и струйным насосам. Перепад давления 0,4–1,2 кгс/см². Табло НАСОС № 1 РАБОТАЕТ горит при давлении больше 0,18 кгс/см².'},
{n:'Подкачивающий насос ЭЦН-91С (бак 2)',p:[.5,1.1,-.6],m:0,i:'Такой же насос в правом расходном баке. При отказе обоих подкачивающих насосов топливо идёт к двигателям самотёком на высоте до 3500 м, перекачка из ПТБ прекращается.'},
{n:'ЭМК 610200 (подвесные баки)',p:[.5,1.1,0],m:0,i:'Электромагнитный клапан управления перекачкой из ПТБ. Открывается выключателем ПОДВЕСН БАКИ. Закрывают по табло ВЫКЛЮЧИ ПЕРЕКАЧ.'},
{n:'Струйный сигнализатор уровня',p:[.7,.93,0],m:0,i:'Стоит на верхней плите бака № 3. Пока бак не полон, пропускает командное топливо под диафрагму — перекачка из ПТБ идёт. Когда бак полон и сигнализатор в топливе, командное давление пропадает и перекачка останавливается.'},
{n:'Датчик-сигнализатор ДСМК-8А-19',p:[1.05,.93,-.3],m:0,i:'На плите бака № 3. Сигнализирует о полной заправке баков 3, 4, 5 и об окончании выработки ПТБ: после ухода из бака № 3 около 150 л включает табло ВЫКЛЮЧИ ПЕРЕКАЧ.'},
{n:'Перекачивающий насос ЭЦН-91С (бак 4)',p:[-.1,-.9,.68],m:0,i:'Перекачивает топливо из нижних баков в расходные. Включается выключателем на пульте топливной системы, выключается сам по сигналу топливомера, когда баки 4 и 5 выработаны.'},
{n:'Перекачивающий насос ЭЦН-91С (бак 5)',p:[-1.6,-.9,-.68],m:0,i:'Второй перекачивающий насос. При отказе одного из них перекачка в оба расходных бака сохраняется.'},

{n:'Кран перекачки в бак № 2',p:[.6,1.3,-1.15],m:0,i:'Перекрывной кран 768600МА. Останавливает перекачку в расходный бак № 2 при отказе поплавкового клапана.'},

{n:'Датчик толщины льда ДТЛ-2',p:[.15,1.78,.14],m:0,i:'Шпилька-вибратор с входным и выходным пьезоэлементами и нагревателями. Лёд на шпильке снижает резонансную частоту колебаний — это сигнал обледенения: табло ОБЛЕДЕНЕНИЕ и включение обогрева лопастей. При льде около 3 мм включает собственный нагрев. Стоит в воздухозаборнике вентилятора. При отказе — табло ДАТЧИК ОБЛЕДЕН, обогрев включают вручную.'},

{n:'Лопасть несущего винта',p:[RX+2.2,2.45,0],m:0,i:'На носке приклеена нагревательная накладка из токопроводящей ткани: 4 самостоятельные секции, включаются поочерёдно и обогревают носок по всему периметру. Накладка идёт по всей длине, на 20 % хорды, сверху защищена резиной и оковкой из нержавеющей стали. Ток секции 23–35 А, питание 208 В 400 Гц.'},

{n:'ПЗУ левого двигателя',s:'ПЗУ',p:[-1.732,1.043,.392],lp:[-1.815,1.522,.392],m:1,i:'Пылезащитное устройство. Обогрев смешанный. Горячим воздухом греются входная губа, стенки тоннеля, сепаратор и эжектор вывода пыли. Электричеством — передний и задний обтекатели, носки стоек коллектора, кожух трубопровода и раструб выхода пыли (накладки из стеклоткани с сеткой из нержавеющей стали, ток 35–50 А).'},
{n:'ПЗУ правого двигателя',p:[-1.732,1.043,-.392],m:0,i:'Устроено и обогревается так же, как левое. Свой выключатель ОБОГРЕВ ДВИГ И ПЗУ ПРАВ и свои табло.'},
{n:'Вход двигателя: ВНА, кок, стойки',s:'ВНА и кок',p:[-1.38,1.043,.392],lp:[-1.3,1.52,.87],m:0,i:'Горячим воздухом от последней ступени компрессора греются лопатки ВНА, носовой кок, горизонтальные стойки первой опоры и воздухозаборник термопатрона насоса-регулятора. Вертикальные стойки первой опоры греются горячим маслом. Если лёд нарастёт здесь и сорвётся, он попадёт в компрессор и двигатель может остановиться.'},
{n:'Электрозаслонка 1919Т (обогрев)',p:[-1.063,.713,.392],m:0,i:'Общая заслонка обогрева двигателя и ПЗУ. Открывается выключателем ОБОГРЕВ ДВИГ И ПЗУ, при этом горит табло ОБОГРЕВ ЛЕВ (ПРАВ) ДВИГ ВКЛ. Признак открытия: температура газов растёт не более чем на 50–60 °C, обороты ТК — до 2 %.'},
{n:'Электрозаслонка 1919Т (обогрев), правая',p:[-1.063,.713,-.392],m:0,i:'Заслонка обогрева правого двигателя и ПЗУ. В полёте обогрев двигателей включают поочерёдно.'},
{n:'Терморегулятор',p:[-.829,.713,.392],m:0,i:'Регулирует расход горячего воздуха в зависимости от режима двигателя и температуры воздуха. Чем выше температура, тем меньше проходное сечение — чтобы не перегреть ПЗУ.'},
{n:'Электрозаслонка 1919Т (эжектор ПЗУ)',p:[-1.146,.713,.826],m:0,i:'Вторая заслонка: пускает воздух от компрессора на эжектор ПЗУ, который отсасывает пыль. Это работа ПЗУ, а не обогрев. Одновременно включать ПЗУ и обогрев двигателей на малом газе запрещено.'},
{n:'Отбор воздуха от компрессора',p:[-.645,.869,.392],m:0,i:'Горячий воздух берётся от последней ступени компрессора двигателя. Дальше делится на два потока: на обогрев и на эжектор ПЗУ. Поэтому при включении обогрева мощность двигателя немного падает, а температура газов растёт.'},
{n:'Обогрев стоек маслом',p:[-1.397,1.304,.392],m:0,i:'Вертикальные стойки первой опоры компрессора обогреваются горячим маслом системы смазки двигателя: масло проходит через полости стоек. Отдельно включать не нужно — работает всегда, когда работает двигатель.'},
{n:'Вентилятор',p:[.4,1.6,0],m:0,i:'В воздухозаборнике вентилятора в общем корпусе стоят датчики ДТЛ-2 и ДКТ-1: здесь всегда есть поток наружного воздуха.'},
{n:'Электросеть вертолёта',p:[1.2,.25,0],m:0,i:'Условное обозначение бортовой сети. От неё питаются преобразователь ПЭ-41, обогрев стёкол и электрообогрев ПЗУ.'}];
const F_TH="<h2>Общий принцип работы</h2>\n<p>Двигатели и ВСУ берут топливо только из <b>расходных баков № 1 и 2</b>. Все остальные баки по очереди доливают расходные, чтобы те оставались полными почти до конца полёта. Порядок выработки подобран так, чтобы центровка вертолёта не выходила за пределы.</p>\n<ol>\n<li><b>Подвесные баки № 6–9</b> перекачиваются струйными насосами в бак № 3.</li>\n<li><b>Бак № 3</b> стекает самотёком в бак № 4. Своего насоса у него нет.</li>\n<li><b>Баки № 4 и 5</b> вырабатываются одновременно: перекачивающие насосы ЭЦН-91С подают топливо в расходные баки.</li>\n<li><b>Расходные баки № 1 и 2</b> вырабатываются последними.</li>\n</ol>\n\n<h2>Путь топлива к двигателю</h2>\n<p>Подкачивающий насос ЭЦН-91С расходного бака → узел обратных клапанов → обратный клапан ОК-10А → клапанная коробка → пожарный кран → насос двигателя ДЦН-70.</p>\n<ul>\n<li><b>Узел обратных клапанов</b> отдаёт топливо на ВСУ и на струйные насосы из любого расходного бака и не даёт левой и правой магистралям смешиваться.</li>\n<li><b>Клапанная коробка</b> выравнивает выработку расходных баков. При разнице давлений за насосами больше 0,25 кгс/см² перепускает топливо туда, где давление меньше. При отказе одного насоса питает оба двигателя от одного бака.</li>\n</ul>\n\n<h2>Как работает перекачка из подвесных баков</h2>\n<ol>\n<li>Выключатель ПОДВЕСН БАКИ открывает электромагнитный клапан 610200.</li>\n<li>Командное топливо идёт к струйному сигнализатору уровня в баке № 3.</li>\n<li>Бак № 3 не полон — сигнализатор пропускает топливо под диафрагму клапана насосного агрегата. Диафрагма открывает впуск рабочего топлива из расходных баков.</li>\n<li>Рабочее топливо проходит через сопла двух струйных насосов, создаёт разрежение и подсасывает топливо из ПТБ в бак № 3.</li>\n<li>Бак № 3 наполнился — сигнализатор оказывается в топливе, командное давление пропадает, пружина закрывает впуск. Уровень упал — перекачка возобновляется.</li>\n</ol>\n<p>Неравномерность выработки левых и правых ПТБ — не более 100 л/ч, на управляемость не влияет.</p>\n\n<h2>Сигнализация и контроль</h2>\n<ul>\n<li><b>НАСОС № … РАБОТАЕТ</b> — давление за насосом больше 0,18 кгс/см² (сигнализатор СДУ-2А-0,18).</li>\n<li><b>ПЕРЕКАЧ РАБОТАЕТ</b> — идёт перекачка из ПТБ.</li>\n<li><b>ВЫКЛЮЧИ ПЕРЕКАЧ</b> — ПТБ пусты и из бака № 3 ушло около 150 л. Выключить ПОДВЕСН БАКИ.</li>\n<li><b>БАК № 1 (№ 2) ОСТАЛОСЬ 120 Л</b> — резервный остаток, отдельно по каждому расходному баку.</li>\n<li><b>Топливомер ТПР1-8Б</b>: положения СУММА (без бака № 3), «4+5», «1», «2». Отсчёт СУММА начинается с 1650 л.</li>\n<li><b>Бак № 3 топливомер не показывает.</b> Он пуст, когда показание «4+5» начало уменьшаться.</li>\n<li>Пока ПТБ работают, показание СУММА не уменьшается. Уменьшается — подвесные баки не перекачиваются.</li>\n</ul>\n\n<h2>Нюансы: что будет, если…</h2>\n<p class=\"note\" style=\"margin-top:0\">Пометка «по логике схемы» — вывод из устройства системы, в книге прямо не написано.</p>\n<ul>\n<li><span class=\"q\">Не включили ПОДВЕСН БАКИ.</span> ПТБ не перекачиваются, вертолёт вырабатывает внутренние баки и везёт до 2300 л мёртвым грузом. Признак: СУММА уменьшается с начала полёта.</li>\n<li><span class=\"q\">Включили ПОДВЕСН БАКИ поздно, когда баки 3, 4, 5 уже пусты.</span> Включать надо. Перекачка в бак № 3 пойдёт (нужны только подкачивающие насосы). Дальше топливо стечёт в бак № 4, а в расходные его поднимают перекачивающие насосы, которые уже отключились по сигналу топливомера. Включатся ли они сами — в РЛЭ не сказано. Проверять: растёт ли «4+5», горят ли НАСОС РАБОТАЕТ № 4 и № 5, пополняются ли баки «1» и «2».</li>\n<li><span class=\"q\">Не выключили ПОДВЕСН БАКИ по табло ВЫКЛЮЧИ ПЕРЕКАЧ.</span> В каждом ПТБ есть поплавковый клапан, он перекрывает трубу, когда бак пуст. По логике схемы рабочее топливо продолжает гоняться впустую, а при отказе поплавкового клапана насосы потянут в бак № 3 воздух. Выключать сразу.</li>\n<li><span class=\"q\">Не включили перекачивающие насосы баков 4 и 5.</span> Самая опасная ошибка. Двигатели вырабатывают только расходные баки (620 л), а около 1400 л в баках 3, 4, 5 недоступны. Признак: расходные баки убывают раньше времени, табло НАСОС РАБОТАЕТ № 4, № 5 не горят. Включить насосы сразу, как заметили.</li>\n<li><span class=\"q\">Отказал один перекачивающий насос.</span> Задание продолжать: второй насос подаёт топливо в оба расходных бака (РЛЭ, п. 6.14).</li>\n<li><span class=\"q\">Топливо в расходные баки не поступает.</span> Задание прекратить, посадка на площадку или ближайший аэродром. 620 л в расходных баках хватает на 42 мин и 154 км (500 м, 210–220 км/ч).</li>\n<li><span class=\"q\">Отказал один подкачивающий насос.</span> Оба двигателя питаются от исправного бака через клапанную коробку. Высоту менять до H &lt; 3500 м. Когда баки 3, 4, 5 выработаны (топливо только в расходных) — выключить и исправный насос, питание пойдёт самотёком (РЛЭ, п. 6.13). По логике схемы — чтобы баки вырабатывались одинаково.</li>\n<li><span class=\"q\">Отказали оба подкачивающих насоса.</span> Задание прекратить, посадка на свой или ближайший аэродром. Питание идёт самотёком на высоте до 3500 м. Перекачки из ПТБ нет: нет рабочего топлива для струйных насосов.</li>\n<li><span class=\"q\">Загорелось БАК ОСТАЛОСЬ 120 Л.</span> Проверить, что краны расходных баков открыты и насосы № 4, № 5 включены; проверить топливо по бакам. 120 л — это 7 мин и 25 км; 240 л — 15 мин и 55 км. Невырабатываемый остаток — 10 л на бак. Пилотировать плавно, без скольжений, иначе воздух попадёт в систему и двигатели выключатся.</li>\n<li><span class=\"q\">Отказал поплавковый клапан расходного бака.</span> Лишнее топливо уходит по трубе перелива в бак № 3. Перекачку в этот бак можно остановить краном перекачки.</li>\n<li><span class=\"q\">Есть риск повреждения нижних баков.</span> Закрывают разделительный кран между баками 4 и 5: при пробитии одного второй не вытечет.</li>\n<li><span class=\"q\">Закрыли пожарный кран.</span> Двигатель останавливается. Закрывают только у горящего или выключаемого двигателя.</li>\n<li><span class=\"q\">Аварийный сброс ПТБ.</span> Кнопка АВАРИЙНЫЙ СБРОС у лётчика и оператора, сбрасываются все баки сразу.</li>\n</ul>\n\n<h2>Заправка</h2>\n<ul>\n<li>Заправка через горловины расходных баков и бака № 3. Баки 4 и 5 наполняются самотёком из бака № 3.</li>\n<li>Табло БАК № 3 ПОЛОН означает, что полны и баки 4, 5.</li>\n<li>Сначала заправляют внутренние баки, потом подвесные. В ПТБ уровень смотрят через смотровое окно.</li>\n<li>При недозаправке бака № 3 на 150 л и больше перед полётом кратковременно горит ВЫКЛЮЧИ ПЕРЕКАЧ.</li>\n</ul>\n\n<h2>Цифры</h2>\n<div class=\"card\"><table>\n<tr><td>Расходные баки № 1 и 2</td><td>по 320 л</td></tr>\n<tr><td>Бак № 3 (вертикальный)</td><td>480 л</td></tr>\n<tr><td>Бак № 4 / бак № 5</td><td>460 л / 500 л</td></tr>\n<tr><td>Подвесные баки № 6–9</td><td>по 575 л</td></tr>\n<tr><td>Основные баки по РЛЭ</td><td>2075 л (1608 кг)</td></tr>\n<tr><td>Четыре ПТБ по РЛЭ</td><td>2300 л (1782 кг)</td></tr>\n<tr><td>Масса пустого ПТБ</td><td>41 кг</td></tr>\n<tr><td>Перепад давления на ЭЦН-91С</td><td>0,4–1,2 кгс/см²</td></tr>\n<tr><td>Сигнал работы насоса</td><td>0,18 кгс/см²</td></tr>\n<tr><td>Срабатывание клапанной коробки</td><td>0,25 кгс/см²</td></tr>\n<tr><td>Начало перекачки из баков 4, 5</td><td>уровень в расходных −30…50 л</td></tr>\n<tr><td>Табло ВЫКЛЮЧИ ПЕРЕКАЧ</td><td>−150 л в баке № 3</td></tr>\n<tr><td>Резервный остаток</td><td>120 л на бак</td></tr>\n<tr><td>Пенополиуретан в баках 3, 4, 5</td><td>−3 % объёма</td></tr>\n</table></div>\n<p class=\"note\">Схема учебная: расположение баков и труб условное, связи — по разделу 7.4 книги (рис. 7.20, 7.23) и РЛЭ (пп. 6.13–6.15, 8.4.7). Номера подвесных баков по бортам расставлены условно. При расхождении цифр верь РЛЭ.</p>\n";
const O_TH="<h2>Общий принцип работы</h2>\n<p>У каждого двигателя своя отдельная маслосистема. Масло Б-3В ходит по кругу: <b>бак → насос → фильтр → опоры и приводы → откачка → радиатор → бак</b>. Оно смазывает, охлаждает, выносит продукты износа, снижает шум и защищает от коррозии.</p>\n<h2>Нагнетание (жёлтые трубы)</h2>\n<ol>\n<li>Из маслобака масло самотёком идёт к нагнетающему насосу агрегата МА-78.</li>\n<li>Насос подаёт его через запорный клапан ЗК-2 в фильтр (сетка 0,063 мм).</li>\n<li>Редукционный клапан в насосе держит давление 3–4 кгс/см².</li>\n<li>Из фильтра масло расходится: по каналам коробки приводов — на коробку, центральный привод и 1-ю опору; по внешним трубам — на стартер, 2-ю и 3-ю опоры; через отсечной клапан — на 4-ю и 5-ю опоры.</li>\n<li>Каждая линия кончается форсункой с жиклёром, он дозирует масло на узел.</li>\n</ol>\n<h2>Откачка (красные и синяя трубы)</h2>\n<ul>\n<li><b>Опоры 2, 3, 4, 5:</b> три откачивающих насоса МА-78 → ЗК-1 → сигнализатор стружки СС-78 → радиатор → бак.</li>\n<li><b>1-я опора и центральный привод:</b> два насоса МА-78 → прямо в бак, мимо радиатора.</li>\n<li><b>Коробка приводов:</b> насос НМО-78 → прямо в бак.</li>\n</ul>\n<p>Откачивающих насосов пять, а нагнетающий один: масло возвращается вспененным, с воздухом, и его объём больше.</p>\n<h2>Что защищает систему</h2>\n<ul>\n<li><b>ЗК-1 и ЗК-2</b> — на стоящем двигателе не дают маслу стечь из радиатора и бака в двигатель.</li>\n<li><b>Отсечной клапан</b> — при оборотах ТК ниже 15 % закрывает масло к 4-й и 5-й опорам, чтобы оно не ушло в выхлопной патрубок.</li>\n<li><b>Перепускной клапан</b> — при давлении в откачке выше 1,25 кгс/см² пускает масло мимо радиатора.</li>\n<li><b>Термоклапан радиатора</b> — на холодном масле открыт (мимо сот), закрывается при 60 ± 5 °C.</li>\n<li><b>Сапун</b> — держит разрежение в коробке приводов для работы уплотнений.</li>\n</ul>\n<h2>Контроль в кабине</h2>\n<ul>\n<li><b>Давление</b> — датчик ИДТ-8К на подводе к 4-й и 5-й опорам.</li>\n<li><b>Температура</b> — датчик П-2Т на откачке перед радиатором (самое горячее масло).</li>\n<li><b>Стружка</b> — СС-78, жёлтые табло СТРУЖКА В МАСЛЕ левого и правого двигателя.</li>\n</ul>\n<h2>Цифры</h2>\n<div class=\"card\"><table>\n<tr><td>Давление на малом газе</td><td>не менее 2 кгс/см²</td></tr>\n<tr><td>Давление на прогреве (МГ), допускается</td><td>до 4,8 кгс/см²</td></tr>\n<tr><td>Давление на рабочих режимах</td><td>3–4 кгс/см²</td></tr>\n<tr><td>Запуск без подогрева, t масла</td><td>не ниже −40 °C</td></tr>\n<tr><td>Выход на режим выше МГ</td><td>не ниже +30 °C</td></tr>\n<tr><td>Длительная работа на II крейсерском и выше</td><td>не ниже +70 °C</td></tr>\n<tr><td>Рекомендуемая температура</td><td>+80…140 °C</td></tr>\n<tr><td>Максимальная температура</td><td>+150 °C</td></tr>\n<tr><td>Расход масла</td><td>не более 0,3 л/ч</td></tr>\n<tr><td>Вместимость маслобака</td><td>13 л</td></tr>\n<tr><td>Заправка маслобака</td><td>8–11 л</td></tr>\n</table></div>\n<p class=\"note\">Схема учебная: расположение агрегатов и труб условное, связи — по главе 11 книги (рис. 11.1). При расхождении цифр верь РЛЭ.</p>\n";
const P_TH="<h2>Общий принцип</h2>\n<p>Система не даёт льду нарастать на лопастях несущего и рулевого винтов, передних стёклах кабин, ПЗУ и входных устройствах двигателей. В разных местах лёд убирают разным теплом:</p>\n<div class=\"card\"><table>\n<tr><td>Лопасти НВ и РВ</td><td>электричество</td></tr>\n<tr><td>Передние стёкла</td><td>электричество</td></tr>\n<tr><td>ПЗУ</td><td>горячий воздух + электричество</td></tr>\n<tr><td>Вход двигателя: ВНА, кок, горизонтальные стойки</td><td>горячий воздух</td></tr>\n<tr><td>Вертикальные стойки 1-й опоры</td><td>горячее масло</td></tr>\n</table></div>\n<p>Лопастями управляет автомат <b>КВАНТ-2</b>: сам замечает лёд и сам включает обогрев. Обогрев двигателей и ПЗУ и обогрев стёкол лётчик включает вручную.</p>\n\n<h2>Автомат КВАНТ-2</h2>\n<ul>\n<li><b>Состав:</b> датчик толщины льда ДТЛ-2, датчик температуры ДКТ-1 и электронный преобразователь ПЭ-41. Оба датчика стоят в воздухозаборнике вентилятора.</li>\n<li><b>ДТЛ-2</b> — шпилька-вибратор с пьезоэлементами. Лёд на шпильке делает её тяжелее, и частота колебаний падает. Это сигнал: загорается красное табло ОБЛЕДЕНЕНИЕ, включается обогрев лопастей. При льде около 3 мм датчик включает собственный нагрев и сбрасывает лёд, чтобы мерить заново. Чувствительность по РЛЭ — не более 1 мм.</li>\n<li><b>ДКТ-1</b> — цифровой термометр наружного воздуха. По его температуре автомат выбирает длительность и частоту обогрева. При температуре выше +20 °C система отключается сама.</li>\n<li><b>ПЭ-41</b> включает секции лопастей по очереди, а не все сразу — так экономится мощность генераторов.</li>\n<li>После выхода из зоны обледенения автомат снимает сигнал и, доработав заключительные циклы, выключает обогрев.</li>\n</ul>\n\n<h2>Лопасти несущего и рулевого винтов</h2>\n<ul>\n<li><b>НВ:</b> на носке каждой лопасти приклеена нагревательная накладка из токопроводящей ткани, 4 секции. Секции включаются поочерёдно и обогревают носок по всему периметру. Накладка идёт по всей длине лопасти, на 20 % хорды.</li>\n<li><b>РВ:</b> по 2 секции на лопасти, верхняя и нижняя, из тонких полосок нержавеющей стали.</li>\n<li><b>Токосъёмники</b> передают ток с неподвижного вертолёта на вращающийся винт. У НВ токосъёмник стоит над втулкой: коллектор с кольцами и щёткодержатели, сверху колпак. У РВ корпус со щётками неподвижен на хвостовом редукторе, коллектор вращается с валом.</li>\n<li><b>Цикл:</b> 6 импульсов по 5 с. При проверке табло СЕКЦИИ ЛОПАСТЕЙ НВ загораются в порядке 1, 2, 3, 4, 1, 2; одновременно работают РВ1 и РВ2.</li>\n<li><b>Защита от перегрева:</b> автомат отключает обогрев, если секция греется дольше 30 с.</li>\n<li><b>Режимы:</b> переключатель ВКЛ ПОС — АВТ (включает КВАНТ-2 по датчику) или РУЧН (включено постоянно).</li>\n</ul>\n<p>Почему греют не постоянно, а импульсами: лёд не нужно растапливать целиком. Достаточно подплавить слой у поверхности, и центробежная сила с потоком воздуха сбросят корку. Это общий принцип таких систем, в книге он не расписан.</p>\n\n<h2>Передние стёкла</h2>\n<ul>\n<li>Два обогреваемых бронестекла: у лётчика и у оператора. Стекло — два силикатных слоя, склеенных плёнкой. На внутренней поверхности нанесена прозрачная токопроводящая плёнка — это и есть нагреватель.</li>\n<li>Регулятор ТЭР-1М с термодатчиком включает нагрев, когда стекло остыло, и отключает при 30 °C.</li>\n<li>Переключатель ОБОГРЕВ СТЕКОЛ: СЛАБО — СИЛЬНО, выключение — нейтральное положение.</li>\n<li>Дополнительно: стеклоочистители с электромеханизмами ЭПК-2Т-60 и спиртовая система омыва.</li>\n</ul>\n\n<h2>ПЗУ и входные устройства двигателей</h2>\n<p>Горячий воздух отбирается от последней ступени компрессора и делится на два потока, на каждом стоит электрозаслонка 1919Т.</p>\n<ul>\n<li><b>Первый поток</b> идёт через терморегулятор и заслонку на обогрев. Чем горячее воздух, тем сильнее терморегулятор прикрывает сечение.</li>\n<li><b>У ПЗУ воздухом греются:</b> входная губа, стенки тоннеля, сепаратор и эжекторное устройство вывода пыли. Воздух попадает в кольцевой коллектор внутри губы, выходит через отверстия-сопла и кольцевую щель, обтекает губу и греет пристеночную зону тоннеля.</li>\n<li><b>У двигателя воздухом греются:</b> горизонтальные стойки первой опоры, лопатки ВНА, носовой кок и воздухозаборник термопатрона насоса-регулятора.</li>\n<li><b>Второй поток</b> идёт через свою заслонку на эжектор ПЗУ (отсос пыли). Это не обогрев, а работа самого ПЗУ.</li>\n<li><b>Электричеством у ПЗУ греются:</b> передний и задний обтекатели, носки стоек коллектора, кожух трубопровода и раструб выхода пыли. На них приклеены накладки из стеклоткани с нагревателями из нержавеющей сетки. Температуру держат регуляторы ТЭР-1М.</li>\n<li><b>Маслом греются</b> вертикальные стойки первой опоры: через них проходит горячее масло системы смазки.</li>\n</ul>\n<p>Включение — выключателями ОБОГРЕВ ДВИГ И ПЗУ ЛЕВ и ПРАВ. Открывается заслонка 1919Т — горят табло ОБОГРЕВ ЛЕВ (ПРАВ) ДВИГ ВКЛ. Одновременно подаётся питание на электрообогрев ПЗУ — горят ОБОГРЕВ ЛЕВ (ПРАВ) ПЗУ ВКЛ.</p>\n\n<h2>Правила эксплуатации (РЛЭ)</h2>\n<ul>\n<li><span class=\"q\">+5 °C и ниже.</span> Все полёты — только с включённым вручную обогревом двигателей и ПЗУ и обогревом ППД. Обогрев стёкол — в положение СЛАБО.</li>\n<li><span class=\"q\">Обледенение разрешено до −20 °C.</span> При условиях обледенения ниже −20 °C — выходить из зоны.</li>\n<li><span class=\"q\">Обогрев двигателей в полёте включать по одному.</span> Включил один, убедился, что двигатель работает устойчиво, — включай второй. Причина: при включении лёд может сорваться во вход двигателя и остановить его. Если двигатель остановился — ПОС второго не включать, выйти из зоны обледенения.</li>\n<li><span class=\"q\">Позднее включение опасно.</span> Лёд, наросший на входе, при включении сбрасывается в двигатель.</li>\n<li><span class=\"q\">Есть лёд на стёклах, а табло ОБЛЕДЕНЕНИЕ не горит.</span> Включить ПОС винтов вручную: ВКЛ ПОС — в РУЧН.</li>\n<li><span class=\"q\">Стёкла.</span> Сначала СЛАБО, СИЛЬНО — не раньше чем через 5 мин. Если СЛАБО было включено до взлёта, СИЛЬНО можно сразу. Причина по логике: холодное стекло от резкого нагрева может треснуть.</li>\n<li><span class=\"q\">Включение обогрева двигателей на земле</span> — на режиме не выше правой коррекции, а при температуре выше +15 °C не дольше 1 мин (перегрев ПЗУ). Одновременно включать ПЗУ и обогрев двигателей на малом газе запрещено.</li>\n<li><span class=\"q\">Снег при −5 °C и ниже.</span> Рулить по снегу и в снегопад с выключенной ПОС ПЗУ и двигателей, включать её перед взлётом.</li>\n<li><span class=\"q\">Снижение в условиях обледенения</span> — при оборотах ТК не ниже 86 %, чтобы хватало горячего воздуха.</li>\n<li><span class=\"q\">Отказ одного генератора.</span> ПОС лопастей НВ отключается — выходить из зоны обледенения.</li>\n<li><span class=\"q\">Что меняется при включении.</span> Температура газов растёт до 50–60 °C, обороты ТК — до 2 %: часть воздуха уходит на обогрев. Возможны лёгкие подёргивания ручки в такт переключению секций и пропадание позывных приводной станции дальше 50 км.</li>\n<li><span class=\"q\">После выхода из зоны</span> при температуре выше +5 °C ручной обогрев винтов выключить через 2–3 мин, иначе нагреватели выйдут из строя.</li>\n</ul>\n\n<h2>Отказы КВАНТ-2</h2>\n<ul>\n<li><b>Отказ ПЭ-41</b> (табло КВАНТ НЕИСПР, ПРЕОБРАЗ, ПОС НВ РВ НЕИСПР, речь «ПОС отказ»): выйти из зоны обледенения, при условиях обледенения — прекратить задание и садиться.</li>\n<li><b>Отказ ДТЛ-2</b> (табло ДАТЧИК ОБЛЕДЕН): включить обогрев вручную, РУЧН, задание продолжать.</li>\n<li><b>Отказ ДКТ-1</b> (табло ДАТЧИК ТЕМПЕР): задание продолжать, автомат греет секции импульсами по 30 с.</li>\n</ul>\n\n<h2>Цифры</h2>\n<div class=\"card\"><table>\n<tr><td>Ток секции лопасти НВ</td><td>23–35 А</td></tr>\n<tr><td>Ток пары лопастей РВ</td><td>20–30 А</td></tr>\n<tr><td>Ток электрообогрева ПЗУ</td><td>35–50 А</td></tr>\n<tr><td>Ток обогрева стёкол</td><td>15–30 А</td></tr>\n<tr><td>Цикл обогрева лопастей</td><td>6 импульсов по 5 с</td></tr>\n<tr><td>Отключение секции при перегреве</td><td>более 30 с</td></tr>\n<tr><td>КВАНТ ИСПРАВЕН после включения</td><td>до 40 с</td></tr>\n<tr><td>Система отключается при температуре</td><td>выше +20 °C</td></tr>\n<tr><td>Стекло: отключение нагрева</td><td>30 °C</td></tr>\n<tr><td>Нагреватель лопасти по хорде</td><td>20 %</td></tr>\n<tr><td>Проверка ПОС: обороты НВ</td><td>95 ± 2 %</td></tr>\n<tr><td>Повтор кнопки КОНТРОЛЬ КВАНТ</td><td>через 2 мин, далее 15 мин</td></tr>\n<tr><td>Непрерывная работа КВАНТ-2</td><td>не более 4 ч</td></tr>\n</table></div>\n<p class=\"note\">Схема учебная: расположение агрегатов и проводки условное, связи — по разделу 7.8 книги (рис. 7.33, 7.34) и РЛЭ (пп. 4.33, 8.4.4). Электрические линии показывают только, что откуда питается; откуда именно берётся питание стёкол и ПЗУ, в книге не указано. Анимация секций ускорена. При расхождении цифр верь РЛЭ.</p>\n";

// Наружные поверхности коробки и навесных агрегатов в координатах эскиза двигателя.
function engineCasting(face, segments=16) {
  const alloy='#9aa4a5', rim='#c4cdcb', seal='#424d52', paint='#8c4b3b';
  function shell(rows,color) {
    const last=rows.length-1;
    face(rows[0].slice().reverse(),color);
    for(let i=0;i<last;i++) for(let j=0;j<rows[i].length;j++){
      const k=(j+1)%rows[i].length;
      face([rows[i][j],rows[i][k],rows[i+1][k],rows[i+1][j]],color);
    }
    face(rows[last],color);
  }
  const circle=(x,y,z,r,n)=>Array.from({length:n},(_,j)=>{
    const a=2*Math.PI*j/n;
    return [x,y+r*Math.cos(a),z+r*Math.sin(a)];
  });
  const turned=(y,z,profile,color,n=segments)=>shell(profile.map(([x,r])=>circle(x,y,z,r,n)),color);
  // Один выпуклый контур обеспечивает общую торцевую плоскость для трёх крышек.
  const contour=[[.93,-.39],[.99,-.55],[1.17,-.62],[1.32,-.55],[1.55,-.33],
    [1.69,-.20],[1.74,0],[1.69,.20],[1.55,.33],[1.32,.55],[1.17,.62],[.99,.55],[.93,.39]];
  shell([[-3.49,.94],[-3.45,1],[-3.02,1],[-2.94,.91]].map(([x,s])=>
    contour.map(([y,z])=>[x,1.27+(y-1.27)*s,z*s]).reverse()),alloy);
  for(const [y,z,r] of [[1.40,0,.295],[1.13,-.4,.153],[1.13,.4,.153]]){
    turned(y,z,[[-3.565,r*.93],[-3.55,r],[-3.498,r]],rim);
    turned(y,z,[[-3.581,r*.79],[-3.571,r*.82],[-3.561,r*.82]],seal);
    turned(y,z,[[-3.615,r*.47],[-3.605,r*.56],[-3.577,r*.56]],alloy);
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      turned(y+Math.cos(a)*r*.89,z+Math.sin(a)*r*.89,[[-3.578,.017],[-3.562,.018]],seal,6);
    }

{t:'Подкачивающие насосы',txt:'Внизу каждого расходного бака стоит электронасос ЭЦН-91С. Он создаёт давление 0,4–1,2 кгс/см² и гонит топливо к своему двигателю. Давление больше 0,18 — горит табло НАСОС РАБОТАЕТ.',focus:N.n1,st:{on:['eng1','eng2']},hl:['eng1','eng2']},
{t:'Узел обратных клапанов',txt:'От обеих магистралей узел берёт топливо на ВСУ и на струйные насосы. Обратные клапаны не дают левой и правой магистралям смешиваться.',focus:N.uz,st:{on:['eng1','eng2','uz','apu','wf']},hl:['uz','apu','wf']},
{t:'Клапанная коробка',txt:'Соединяет две магистрали. Обычно закрыта. Если давление за насосами различается больше чем на 0,25 кгс/см² или один насос отказал, она перепускает топливо — и оба двигателя питаются от одного бака.',focus:N.kk,st:{on:['eng1','eng2','uz','apu','kk']},hl:['kk','eng1','eng2']},
{t:'Пожарные краны и двигатели',txt:'Перед каждым двигателем стоит пожарный кран. Дальше топливо попадает в насос двигателя ДЦН-70. Закрытый кран останавливает двигатель.',focus:'Пожарный кран (левый)',st:{on:['eng1','eng2','uz','apu']},hl:['eng1','eng2']},
{t:'Подвесные баки: струйные насосы',txt:'В ПТБ насосов нет. Часть топлива от подкачивающих насосов идёт в насосный агрегат, проходит через сопла и создаёт разрежение — оно высасывает топливо из ПТБ в бак № 3. Включается выключателем ПОДВЕСН БАКИ.',focus:N.ag,st:{lv:{ptb:.5}},hl:['ptb','wf','cmd']},
{t:'Автоматика бака № 3',txt:'Струйный сигнализатор следит за уровнем в баке № 3. Бак не полон — пропускает командное топливо, перекачка идёт. Бак полон — перекрывает, перекачка стоит. Поэтому бак № 3 всё время полный, пока в ПТБ есть топливо.',focus:'Струйный сигнализатор уровня',st:{lv:{ptb:.5}},hl:['cmd','wf','ptb']},
{t:'Бак № 3 стекает в бак № 4',txt:'Когда ПТБ кончились, бак № 3 начинает убывать: топливо само стекает в бак № 4. Насоса у него нет. После ухода 150 л загорается ВЫКЛЮЧИ ПЕРЕКАЧ.',focus:'Бак № 3 (вертикальный)',st:{on:BASEON.concat(['grav','xf4','xf5','xfl']),lv:{ptb:0,t3:.5},tab:['n1','n2','n4','n5','vyk','sum']},hl:['grav']},
{t:'Перекачка из баков 4 и 5',txt:'Перекачивающие насосы поднимают топливо в расходные баки. Поплавковый клапан открывается, когда уровень упал на 30–50 л, и закрывается, когда бак полон. Насосы выключаются сами по сигналу топливомера.',focus:N.n4,st:{on:BASEON.concat(['xf4','xf5','xfl']),lv:{ptb:0,t3:0,t4:.5,t5:.5},tab:['n1','n2','n4','n5','sum']},hl:['xf4','xf5','xfl']},
{t:'Расходные баки — последние',txt:'Остаётся 620 л в расходных баках — это 42 мин полёта. При 120 л в баке горит БАК ОСТАЛОСЬ 120 Л: 7 мин на бак. Пилотировать плавно, без скольжений.',focus:'Расходный бак № 1',st:{on:BASEON,lv:{ptb:0,t3:0,t4:0,t5:0,t1:.38,t2:.38},tab:['n1','n2','b1','b2','sum'],gauge:{sum:'СУММА: 240 л'}},view:{tg:[.6,1.2,0],zoom:2,yaw:-.62,pitch:.42}}],
fails:[
{t:'Не включили ПОДВЕСН БАКИ',txt:'<b>Что происходит.</b> Перекачки из ПТБ нет. Вырабатываются внутренние баки, а до 2300 л в подвесных остаются мёртвым грузом.<br><b>Признак.</b> Показание СУММА уменьшается с начала полёта, табло ПЕРЕКАЧ РАБОТАЕТ не горит.<br><b>Действия.</b> Включить ПОДВЕСН БАКИ, убедиться, что загорелось ПЕРЕКАЧ РАБОТАЕТ. Если баки 3, 4, 5 уже пусты — включить и проверить, растёт ли «4+5» и горят ли НАСОС РАБОТАЕТ № 4, № 5: перекачивающие насосы уже отключились, включатся ли они сами, в РЛЭ не сказано.',st:{on:BASEON.concat(['grav','xf4','xf5','xfl']),lv:{t3:.5},tab:['n1','n2','n4','n5','sum'],gauge:{sum:'СУММА: 1400 л ↓'}},focus:'ЭМК 610200 (подвесные баки)',hl:['ptb','wf','cmd']},
{t:'Не включили перекачивающие насосы баков 4, 5',txt:'<b>Что происходит.</b> Самая опасная ошибка. Двигатели вырабатывают только расходные баки (620 л), а около 1400 л в баках 3, 4, 5 недоступны.<br><b>Признак.</b> Расходные баки убывают раньше времени, табло НАСОС РАБОТАЕТ № 4, № 5 не горят.<br><b>Действия (РЛЭ, п. 6.14).</b> Нажать КОНТРОЛЬ ТАБЛО. Проверить выключатели насосов, включить. По топливомеру убедиться, что расходные баки пополняются. Если топливо не идёт — задание прекратить, посадка на площадку или ближайший аэродром.',st:{on:BASEON,lv:{ptb:0,t1:.5,t2:.5},tab:['n1','n2','sum'],broken:[N.n4,N.n5]},view:{tg:[-.4,.1,0],zoom:1.4,yaw:-.62,pitch:.42},hl:['xf4','xf5','xfl']},
{t:'Отказал один перекачивающий насос',txt:'<b>Что происходит.</b> Баки 4 и 5 соединены, а линии перекачки связаны перемычкой. Исправный насос подаёт топливо в оба расходных бака.<br><b>Действия (РЛЭ, п. 6.14).</b> Задание продолжать, следить за топливом в расходных баках.',st:{on:BASEON.concat(['xf4','xfl']),lv:{ptb:0,t3:0,t4:.5,t5:.5},tab:['n1','n2','n4','sum'],broken:[N.n5]},focus:N.n5,hl:['xf4','xfl','sep']},
{t:'Отказал один подкачивающий насос',txt:'<b>Что происходит.</b> Клапанная коробка перепускает топливо, оба двигателя питаются от исправного бака.<br><b>Признак.</b> Табло НАСОС № … РАБОТАЕТ погасло.<br><b>Действия (РЛЭ, п. 6.13).</b> Высоту менять до 3500 м и ниже. Когда баки 3, 4, 5 выработаны — выключить и исправный насос, питание пойдёт самотёком. По логике схемы — чтобы расходные баки вырабатывались одинаково.',st:{on:['eng2','eng1','kk','uz','apu','xf4','xf5','xfl'],lv:{ptb:0,t3:0,t4:.5,t5:.5},tab:['n2','n4','n5','sum'],broken:[N.n1]},focus:N.kk,hl:['kk','eng1','eng2']},
{t:'Отказали оба подкачивающих насоса',txt:'<b>Что происходит.</b> Топливо идёт к двигателям самотёком и подсосом насосов ДЦН-70. Перекачки из ПТБ нет: струйным насосам не из чего делать струю.<br><b>Действия (РЛЭ, п. 6.13).</b> Задание прекратить, высота не более 3500 м, посадка на своём или ближайшем аэродроме.',st:{on:['xf4','xf5','xfl','grav'],lv:{ptb:.5},tab:['n4','n5','sum'],broken:[N.n1,N.n2]},view:{tg:[.5,1.2,0],zoom:1.9,yaw:-.62,pitch:.42},hl:['eng1','eng2','wf','ptb']},
{t:'Отказал поплавковый клапан расходного бака',txt:'<b>Что происходит.</b> Клапан не закрылся, перекачка в полный бак продолжается. Лишнее топливо уходит по трубе перелива в бак № 3 — бак не лопнет.<br><b>Действия.</b> Перекачку в этот бак можно остановить краном перекачки (по логике схемы; в книге сказано, что краны для этого и предназначены).',st:{lv:{ptb:0,t3:.6,t4:.6,t5:.6},on:BASEON.concat(['xf4','xf5','xfl','grav']),tab:['n1','n2','n4','n5','sum'],broken:['Поплавковый клапан бака № 1']},focus:'Кран перекачки в бак № 1',hl:['xf4']},
{t:'Риск повреждения нижних баков',txt:'<b>Что делают.</b> Закрывают разделительный кран в нижнем патрубке между баками 4 и 5. Если один бак пробит, топливо второго не вытечет вместе с ним.<br>По логике схемы: при закрытом кране каждый нижний бак вырабатывается своим насосом.',st:{on:BASEON.concat(['xf4','xf5','xfl']),lv:{ptb:0,t3:0,t4:.2,t5:.6},tab:['n1','n2','n4','n5','sum']},focus:'Разделительный кран',hl:['sep','xf4','xf5']},
{t:'Загорелось БАК ОСТАЛОСЬ 120 Л',txt:'<b>Действия (РЛЭ, п. 6.15).</b> Проверить, что краны расходных баков открыты (табло ЗАКРЫТ КРАН не горят) и насосы № 4, № 5 включены. Проверить топливо в баках 1, 2, 4 и 5. Принять решение: лететь до ближайшего аэродрома или садиться на площадку.<br><b>Цифры.</b> 120 л — 7 мин, 25 км. 240 л — 15 мин, 55 км (500 м, 210–220 км/ч). Невырабатываемый остаток — 10 л на бак.<br>Пилотировать плавно, без скольжений: иначе в систему попадёт воздух и двигатели выключатся.',st:{on:BASEON,lv:{ptb:0,t3:0,t4:0,t5:0,t1:.36,t2:.36},tab:['n1','n2','b1','b2','sum'],gauge:{sum:'СУММА: 230 л'}},view:{tg:[.6,1.2,0],zoom:2,yaw:-.62,pitch:.42}}],
theory:F_TH};

}
cyl([-3.15,1.1,.3],[-2.85,1.1,.3],.14,'#5a52c0',1,12);cyl([-2.6,1.45,.35],[-2.6,1.62,.35],.08,'#9a9890',1,10);cyl([-2.6,1.62,.35],[-2.6,1.66,.35],.11,'#77756f',1,10);

rbox([-3.3,0,1.6],[.78,1.1,.78],'#c4861f',1);cyl([-3.3,.55,1.6],[-3.3,.66,1.6],.13,'#8a5d12',1,12);box([-3.3,.05,1.995],[.09,.55,.02],'#f3e3b0');box([-3.3,-.08,2.0],[.09,.3,.02],'#b8771a');

function gearboxCase(alpha=1){
  const center=MODEL_LAYOUT.gearboxCenter, up=[0,1,0], casting='#829088', flange='#a4afa7';
  lathe(center,up,[[-.57,.22],[-.54,.32],[-.49,.34],[-.47,.32],[-.31,.34],[-.28,.39],
    [-.23,.39],[-.21,.36],[.02,.46],[.14,.49],[.15,.53],[.19,.53],[.20,.48],
    [.26,.45],[.37,.36],[.43,.26],[.46,.17],[.49,.15]],casting,alpha,26);
  for(const p of circ([center[0],2.76,center[2]],up,.50,14)){
    cyl(p,[p[0],p[1]+.027,p[2]],.023,flange,alpha,6);
    const dx=p[0]-center[0],dz=p[2]-center[2];
    cyl([center[0]+dx*.72,2.94,center[2]+dz*.72],p,.018,flange,alpha,6);
  }
  const point=(x,y,z)=>[center[0]+x,y,center[2]+z];
  const steel='#99a4a4', dark='#475451';
  const rear=point(.52,2.735,0);
  function lug(p){
    cyl([p[0],p[1]-.04,p[2]],[p[0],p[1]+.026,p[2]],.061,casting,alpha,10);
    cyl(p,[p[0],p[1]+.034,p[2]],.026,steel,alpha,6);
  }
  function brace(top,foot){
    const delta=sub3(foot,top);
    const along=k=>top.map((v,i)=>v+k*delta[i]);
    cyl(top,foot,.022,steel,alpha,10);
    for(const k of [.06,.85])cyl(along(k),along(k+.09),.031,flange,alpha,8);
  }
  lug(rear);
  for(const side of [-1,1]){
    const input=side>0?0:1;
    const mouth=MODEL_LAYOUT.gearboxInputs[input];
    const axis=nrm(sub3(mouth,MODEL_LAYOUT.engineOutputs[input]));
    lathe(mouth,axis,[[-.102,.096],[-.094,.126],[-.067,.126],[-.06,.109],
      [.075,.113],[.093,.144],[.115,.144],[.13,.122],[.26,.144],[.32,.151]],casting,alpha,20);
    lathe(mouth,axis,[[-.104,.081],[-.103,.096]],dark,alpha,20);
    const face=mouth.map((v,i)=>v-.095*axis[i]);
    for(const bolt of circ(face,axis,.111,8))
      cyl(bolt,bolt.map((v,i)=>v-.012*axis[i]),.009,steel,alpha,6);
    const forward=point(-.24,2.735,side*.463), lateral=point(.055,2.735,side*.51);
    lug(forward);lug(lateral);
    for(const end of [-1,1]){
      const foot=point(end*.63,2.015,side*.84);
      brace(end<0?forward:rear,foot);
      brace(lateral,foot);
      cyl([foot[0],1.981,foot[2]],foot,.062,dark,alpha,12);
    }
  }
}

theory:'<h2>Назначение</h2><p>Гидросистема питает четыре гидроусилителя КАУ-115 (продольное, поперечное, путевое управление, общий шаг), гидроупор продольного управления, фрикцион рычага «шаг — газ», демпфер педалей СДВ-5000-ОА и раздвижные тяги ручки оператора.</p><p>Систем две: основная (ОГС) и дублирующая (ДГС). Вспомогательной, как на Ми-24, нет: шасси не убирается. При отказе ОГС дублирующая обеспечивает управление по всем каналам, но только в ручном режиме.</p><h2>Основные агрегаты</h2><ul><li><b>Гидроблок АГС-60А</b> — общий: бак из двух секций, два гидроаккумулятора, четыре фильтра, распределительная коробка, блок кранов ЭМТ-244. Стоит выше насосов — масло идёт к ним с подпором.</li><li><b>Насосы НП-92А-4</b> — плунжерные, переменной подачи, по одному на систему, на главном редукторе: ОГС слева, ДГС справа. Работают и на самовращении.</li><li><b>КАУ-115</b> — четыре, по необратимой схеме. От ОГС — ручной и комбинированный режим, от ДГС — только ручной.</li><li><b>Трубопроводы</b> окрашены в серый цвет.</li></ul><h2>Как работает</h2><ol><li>Масло из бака идёт к насосу, от насоса под давлением — через фильтр в распределительную коробку, к аккумулятору, предохранительному клапану и датчику давления.</li><li>Через клапан отключения ОГС масло идёт к потребителям. Загорается зелёное ОСНОВН. ВКЛ.</li><li>Это же давление держит клапаны переключения открытыми на слив: насос ДГС работает вхолостую.</li><li>Давление в ОГС упало ниже 50 ± 5 кгс/см² — потребители отсекаются, слив ДГС закрывается, дублирующая система вступает в работу. При 55 кгс/см² — жёлтое ДУБЛИР. ВКЛ.</li></ol><h2>Гидроусилитель КАУ-115</h2><ul><li><b>Ручной режим.</b> Лётчик отклоняет входную качалку, командный золотник пускает масло в одну из полостей цилиндра. Шток движется, пока качалка не вернётся в нейтраль. Скорость штока пропорциональна скорости ручки.</li><li><b>Комбинированный режим.</b> Электромагнитные краны подают масло к рулевой машинке. Сигнал автопилота через электромеханический преобразователь двигает её шток, а он — тот же командный золотник. Датчик обратной связи останавливает движение.</li><li><b>Защита.</b> Ход по сигналам автопилота — не более 18 % полного.</li><li><b>Без давления.</b> Полости цилиндра закольцованы, агрегат работает как жёсткая тяга.</li></ul><h2>Цифры</h2><div class="card"><table><tr><td>Рабочая жидкость</td><td>АМГ-10</td></tr><tr><td>Объём в каждой секции бака</td><td>8,5 л</td></tr><tr><td>Рабочее давление</td><td>65–80 кгс/см²</td></tr><tr><td>Переключение с ОГС на ДГС</td><td>50 ± 5 кгс/см²</td></tr><tr><td>Табло ДУБЛИР. ВКЛ.</td><td>55 кгс/см²</td></tr><tr><td>Предохранительный клапан</td><td>95 кгс/см²</td></tr><tr><td>Азот в аккумуляторах</td><td>40 кгс/см²</td></tr><tr><td>ДУБЛИР. НЕ РАБ.: азот / слив</td><td>ниже 28 / ниже 0,4</td></tr><tr><td>Температура масла</td><td>−40…+80 °C</td></tr><tr><td>Производительность насоса</td><td>не менее 30 л/мин</td></tr><tr><td>Давление в КАУ-115</td><td>64–85 кгс/см²</td></tr><tr><td>Гидроупор: наклон тарелки назад</td><td>до 1°20′</td></tr><tr><td>Гидроупор в полёте</td><td>более 70 км/ч</td></tr><tr><td>Фрикцион РШГ: кнопка нажата / отпущена</td><td>1,5 / 10–15 кгс</td></tr></table></div><p class="note">По книге, раздел 7.1. Расположение агрегатов на схеме условное.</p>'};

qs:[['Общая ёмкость воздушных баллонов','10 л','4 л','6 л','20 л'],['Рабочее давление в воздушной системе','40–50 кгс/см²','65–80 кгс/см²','100 кгс/см²','11 кгс/см²'],['Ёмкость шарового баллона УБШ-4','4 л','3 л','10 л','8 л'],['Командное давление за клапаном УП-25/2','0–11 кгс/см²','0–33 кгс/см²','40–50 кгс/см²','2,1 кгс/см²'],['Давление в тормозах колёс','до 33 ± 3 кгс/см²','до 11 кгс/см²','до 50 кгс/см²','до 60 кгс/см²'],['Во сколько раз ускоритель УП-03/2М увеличивает командное давление','в 3 раза','в 2 раза','в 5 раз','в 10 раз'],['Давление в шлангах герметизации','2,1 кгс/см²','11 кгс/см²','0,4 кгс/см²','5,5 кгс/см²'],['Предохранительный клапан шлангов герметизации срабатывает при','3,2 кгс/см²','2,1 кгс/см²','10 кгс/см²','25 кгс/см²'],['Ёмкость спиртового бачка','10 л','4 л','13 л','2 л'],['Табло ТОРМОЗ КОЛЕС загорается при давлении выше','25 кгс/см²','11 кгс/см²','33 кгс/см²','40 кгс/см²'],['Компрессор АК-50Т1 наполняет баллоны не более чем за','25 мин','5 мин','1 ч','40 с'],['От какого баллона питаются герметизация и опрыск','только от шарового УБШ-4','только от подкосов','от всех трёх','от отдельного баллона в кабине'],['Автомат АД-50 подключает компрессор при давлении','40 кгс/см²','50 кгс/см²','25 кгс/см²','60 кгс/см²']],
theory:'<h2>Назначение</h2><p>Воздушная (пневматическая) система тормозит колёса основных опор, герметизирует дверь лётчика, люк оператора и двери грузовой кабины, обеспечивает опрыск спиртом лобовых стёкол и иллюминаторов ГОЭС-342ВМИ.</p><h2>Контур питания</h2><ul><li><b>Баллоны:</b> полости двух V-образных подкосов шасси по 3 л и шаровой УБШ-4 на 4 л, всего 10 л, давление 40–50 кгс/см².</li><li><b>Компрессор АК-50Т1</b> на главном редукторе справа: две ступени, сжатие до 60 кгс/см², полная зарядка не более чем за 25 мин.</li><li><b>Автомат давления АД-50:</b> 50 кгс/см² — компрессор на сброс, 40 кгс/см² — снова на зарядку.</li><li><b>Фильтр-отстойник</b> отделяет влагу и масло. Вместе с АД-50, фильтром и обратными клапанами стоит на пневмопанели слева между шп. 11 и 12.</li><li><b>На земле</b> — зарядка через бортовой клапан, контроль по манометру НТМ-100 (левый борт, шп. 12–13).</li></ul><h2>Торможение колёс</h2><ol><li>Гашетка на ручке управления через трос нажимает толкатель клапана УП-25/2.</li><li>Клапан выдаёт командное давление 0–11 кгс/см², пропорциональное нажатию.</li><li>Ускоритель УП-03/2М подаёт из баллонов в тормоза давление втрое больше командного.</li><li>Выше 25 кгс/см² сигнализатор МСТ-25А зажигает ТОРМОЗ КОЛЕС.</li><li>Гашетка отпущена — воздух из тормозов стравливается через ускоритель.</li></ol><h2>Герметизация</h2><p>Работает только от шарового баллона. Путь воздуха: вентиль на левом пульте лётчика → силикагелевый влагопоглотитель → фильтр → редуктор РВ-2Т (2,1 кгс/см²) → клапаны герметизации у дверей → шланги. Табло ДВЕРИ ЗАГЕРМ. и ДВЕРИ РАЗГЕРМ.</p><h2>Опрыск</h2><ul><li>Спирт из бачка 10 л (общий). Стёкла: два электропневмоклапана и два насоса 286-5851-05, не менее 12 см³ за нажатие кнопки ОПРЫСК.</li><li>ГОЭС: насос 286-5851-10, 45 см³ на иллюминатор, режим чистки не более 3 мин, включается кнопкой ЧИСТ. на пульте оператора.</li></ul><h2>Цифры</h2><div class="card"><table><tr><td>Ёмкость баллонов</td><td>10 л (3 + 3 + 4)</td></tr><tr><td>Рабочее давление</td><td>40–50 кгс/см²</td></tr><tr><td>Командное давление</td><td>0–11 кгс/см²</td></tr><tr><td>Давление в тормозах</td><td>0–33 ± 3 кгс/см²</td></tr><tr><td>ТОРМОЗ КОЛЕС</td><td>выше 25 кгс/см²</td></tr><tr><td>Шланги герметизации</td><td>2,1 кгс/см²</td></tr><tr><td>Предохранительный клапан шлангов</td><td>3,2 кгс/см²</td></tr><tr><td>Спиртовой бачок</td><td>10 л</td></tr><tr><td>Порция на стекло / на иллюминатор</td><td>12 / 45 см³</td></tr><tr><td>Воздушный фильтр, тонкость</td><td>10–100 мкм</td></tr></table></div><p class="note">По книге, раздел 7.2. Расположение агрегатов на схеме условное.</p>'};

qs:[['Откуда берётся воздух для СКВ','за 12-й ступенью компрессора двигателей','от вентиляторной установки','от компрессора АК-50Т1','от ВСУ в полёте'],['Сколько ступеней охлаждения в СКВ','три: два ВВР и турбохолодильник','одна: турбохолодильник','две: ВВР и фильтр','четыре'],['Температура воздуха от двигателей на входе в СКВ','до 350 °C','до 150 °C','до 90 °C','до 600 °C'],['Давление за регулятором 5731Т-4','4 ± 0,32 кгс/см²','5,5 кгс/см²','2,1 кгс/см²','0,5 кгс/см²'],['СКВ отключается при давлении в магистрали более','5,5 кгс/см²','4 кгс/см²','11 кгс/см²','3,2 кгс/см²'],['Термовыключатель отключает СКВ при температуре','175 ± 25 °C','90 °C','130 °C','350 °C'],['Температура за первичным ВВР при работе с фильтрами','не выше +90 °C','не выше +130 °C','не выше +50 °C','не выше +175 °C'],['Температура воздуха на выходе из турбохолодильника','+1…5 °C','−20 °C','+20 °C','+50 °C'],['Избыточное давление в гермокабине','500 мм вод. ст.','750 мм вод. ст.','100 мм вод. ст.','4 кгс/см²'],['Табло ВЕЛИКО ДАВЛЕН. В КАБИНЕ: давление выше','750 ± 85 мм вод. ст.','500 мм вод. ст.','600 мм вод. ст.','1000 мм вод. ст.'],['Диапазон рабочих температур наружного воздуха для СКВ','−50…+37 °C','−40…+80 °C','−20…+50 °C','−60…+60 °C'],['Расход воздуха на обогрев','не более 1000 кг/ч','не более 500 кг/ч','не более 100 кг/ч','не более 5000 кг/ч'],['Куда клапан 520А стравливает воздух','из грузовой кабины в хвостовую балку','в подкапотное пространство','в кабину оператора','в двигатель']],
theory:'<h2>Назначение</h2><p>Система кондиционирования воздуха (СКВ) поддерживает нормальную температуру в гермокабине в полёте, обогревает кабину на земле, обдувает стёкла и держит в кабине избыточное давление. Состоит из двух контуров: регулирования температуры и поддержания избыточного давления.</p><h2>Путь воздуха</h2><ol><li>Отбор за 12-й ступенью компрессора обоих двигателей, до 350 °C. Термокомпенсаторы, обратные клапаны.</li><li>Первичный ВВР под правым капотом (продувается от вентиляторной установки). За ним +90 °C с фильтрами, +130 °C без фильтров.</li><li>Регулятор избыточного давления: 4 ± 0,32 кгс/см².</li><li>Блок фильтров или обход — выключатель ФИЛЬТР.</li><li>Блок заслонок делит поток: горячая линия и холодная (вторичный ВВР + турбохолодильник, на выходе +1…5 °C).</li><li>Влагоотделитель: смешивание и отделение воды. На входе не ниже +5 °C.</li><li>Коллекторы: кабина оператора, кабина лётчика, грузовая кабина.</li></ol><h2>Автоматика</h2><ul><li><b>РТА-32-7Т</b> — управляет заслонкой первичного ВВР и магистральной заслонкой (приёмник П-2Тр, усилитель ЭП-309Т).</li><li><b>РТА-36-28Т</b> — держит температуру в кабине: приёмники ПП-19 и П-77, усилитель ЭП-528Т, задатчик РР-53-5Т, блок заслонок 3142.</li><li><b>Ручной режим:</b> нажимая ГОРЯЧ или ХОЛОДН, лётчик сам двигает заслонки.</li><li><b>Защита:</b> давление выше 5,5 кгс/см² или температура выше 175 ± 25 °C — магистральная заслонка закрывается, табло СКВ ОТКЛ.</li></ul><h2>Давление в кабине (СРД)</h2><p>Клапан 520А, задатчик 5420А, электропневмоклапан 2259Т и сигнализатор ССН-0,075 стоят на задней стенке грузовой кабины. Избыток держится 500 мм вод. ст. Выше 750 ± 85 — табло ВЕЛИКО ДАВЛЕН. В КАБИНЕ и сброс. Выключатель РАЗГЕРМ. КАБИНЫ разгерметизирует кабину полностью.</p><h2>Расположение</h2><p>Радиатор, заслонки и компенсаторы — в подкапотном пространстве. Фильтры, блок заслонок, вторичный ВВР, турбохолодильник и влагоотделитель — в левом отсеке носовой части под полом между шп. 4Н и 1Ф. Трубы от двигателей до регулятора — из нержавеющей стали, дальше — из алюминиевых сплавов, с теплоизоляцией.</p><h2>Цифры</h2><div class="card"><table><tr><td>Наружный воздух</td><td>−50…+37 °C</td></tr><tr><td>Расход на обогрев / охлаждение</td><td>≤ 1000 / ≥ 500 кг/ч</td></tr><tr><td>Температура в кабине экипажа (автоматика)</td><td>до 50 °C</td></tr><tr><td>Температура в грузовой кабине</td><td>не менее 10 °C</td></tr><tr><td>Давление за регулятором</td><td>4 ± 0,32 кгс/см²</td></tr><tr><td>Отключение по давлению</td><td>5,5 кгс/см²</td></tr><tr><td>Отключение по температуре</td><td>175 ± 25 °C</td></tr><tr><td>За турбохолодильником</td><td>+1…5 °C</td></tr><tr><td>Избыток в кабине</td><td>500 мм вод. ст.</td></tr><tr><td>ВЕЛИКО ДАВЛЕН. В КАБИНЕ</td><td>750 ± 85 мм вод. ст.</td></tr></table></div><p class="note">По книге, раздел 7.3. Расположение агрегатов на схеме условное.</p>'};

qs:[['Сколько защищаемых отсеков у противопожарной системы','4','2','3','6'],['Датчик ДПС срабатывает при температуре выше','150 °C','90 °C','350 °C','60 °C'],['Датчик ДПС срабатывает при скорости роста температуры более','2 °C/с','10 °C/с','0,5 °C/с','20 °C/с'],['Сколько групп датчиков ДПС на вертолёте','12 групп по 3 датчика','4 группы по 3 датчика','9 групп по 2 датчика','6 групп по 6 датчиков'],['Сколько датчиков в отсеке каждого двигателя','9','3','6','12'],['Огнегасящий состав в огнетушителях УБШ-4-4','хладон 114В2','углекислота','азот','пена'],['Давление в огнетушителе УБШ-4-4','100 ± 5 кгс/см²','40–50 кгс/см²','200 кгс/см²','65 кгс/см²'],['Ёмкость огнетушителя УБШ-4-4','4 л','10 л','2 л','8 л'],['Время выброса огнегасящего состава','не более 1,3 с','5 с','12 с','30 с'],['Вторая очередь пожаротушения срабатывает','только вручную','автоматически через 12 с','автоматически при повторном сигнале','вместе с первой'],['Интервал речевого сообщения о пожаре','12 с','1,3 с','30 с','3 с'],['Как погасить табло ПОЖАР после тушения','кнопкой ОТКЛ. СИГН. ПОЖАРА','оно гаснет само','кнопкой 2-ой очереди','выключателем КОНТРОЛЬ ДАТЧИКОВ'],['Пенополиуретан в баках снижает давление взрыва паров','в 35 раз','в 3 раза','в 10 раз','в 100 раз'],['Диаметр отверстий распылительных коллекторов','0,8 мм','3 мм','0,1 мм','8 мм']],
theory:'<h2>Назначение</h2><p>Противопожарная система (ППС) предупреждает, обнаруживает, сигнализирует и тушит пожар в четырёх отсеках: левого двигателя; правого двигателя; главного редуктора и расходных баков № 1, 2; ВСУ ТА-14 и бака № 3.</p><h2>Предупреждение пожара</h2><ul><li>Противопожарные перегородки делят подкапотное пространство на отсеки двигателей, редукторный и концевой.</li><li>Подкапотное пространство продувается набегающим потоком — пары топлива и масла уносит за борт.</li><li>Баки № 3, 4, 5 заполнены пенополиуретаном: он снижает давление взрыва паров в 35 раз. В расходных баках его нет — они почти всегда полные.</li><li>Баки № 1–5 протектированы: слои резины и губки затягивают пробоину.</li><li>Теплоизоляция труб горячего воздуха, металлизация, заземление, статические разрядники.</li></ul><h2>Сигнализация</h2><ul><li>Два комплекта ССП-ФК: исполнительные блоки ССП-ФК-БИ (правая этажерка в кабине) и датчики ДПС.</li><li>ДПС — три хромель-алюмелевые термопары, порог 150 °C и 2 °C/с.</li><li>12 групп по 3 датчика: редуктор и расходные баки — 3 группы (9), ТА-14 — 2 группы (6), бак № 3 — 3 датчика, двигатели — по 3 группы (всего 18).</li><li>Сигнал идёт, только если сработали все три датчика группы.</li><li>Красные табло: ПОЖАР (приборная доска) и четыре ПОЖАР В ОТСЕКЕ… (пульт ППС). Жёлтые: «1» и «2» — срабатывание очередей.</li><li>Речевое сообщение каждые 12 с, автоматическая передача руководителю полётов, запись в БУР-4-1.</li></ul><h2>Тушение</h2><ul><li>Два огнетушителя УБШ-4-4 по 4 л, хладон 114В2, 100 ± 5 кгс/см², масса заряженного 11,75 кг. При 200 кгс/см² мембрана рвётся и состав уходит за борт.</li><li>Пироголовки ПГКЦ — по четыре на баллоне, пиропатроны ПП-3.</li><li>Первая очередь — автоматически или кнопкой, вторая — только кнопкой.</li><li>Выброс состава — не более 1,3 с. Отверстия коллекторов 0,8 мм.</li><li>Переносной огнетушитель — для кабин.</li></ul><h2>Порядок работы</h2><ol><li>Датчики → блок ССП-ФК-БИ → табло, речь, БУР-4-1, радио.</li><li>Напряжение на пиропатроны первой очереди, состав в отсек, табло «1».</li><li>Потушено — табло отсека гаснет, табло ПОЖАР гасят кнопкой ОТКЛ. СИГН. ПОЖАРА.</li><li>«1» не загорелось — РУЧНОЕ ВКЛЮЧЕНИЕ 1-ОЙ ОЧЕРЕДИ.</li><li>Не потушено или новый пожар — РУЧНОЕ ВКЛЮЧЕНИЕ 2-ОЙ ОЧЕРЕДИ.</li></ol><p class="note">По книге, раздел 7.5. Название состава и переносного огнетушителя в книге напечатаны по-разному (ОУ-2 и ОГ-2), на фото читается нечётко — сверь по РЛЭ. Действия экипажа с двигателем при пожаре — по РЛЭ.</p>'};

{t:'Зима: переохлаждение масла',txt:'<b>Проблема.</b> В мороз полный поток воздуха переохлаждает масло.<br><b>Решение.</b> Окна дроссельного устройства в коке вентилятора открывают. Через них идёт дополнительный поток поперёк основного, он создаёт заслон — производительность вентиляторной установки падает.',st:{on:['rad']},focus:'Вентиляторная установка',hl:['rad']},
{t:'Пожар под капотом и воздухозаборники',txt:'<b>Защита.</b> В крышках капота есть заборники для вентиляции подкапотного пространства. На входных тоннелях двигателей — лабиринтные уплотнения, на заборниках — сетки: при пожаре пламя не выбрасывается наружу и не засасывается в двигатели.<br>Патрубки отводят за борт горячий воздух от клапанов перепуска (из-за VII ступени), чтобы не было ложного сигнала о пожаре.',st:{},focus:'Воздушно-масляные радиаторы'},

theory:'<h2>Система воздушного охлаждения</h2><p>Охлаждает масло в воздушно-масляных радиаторах двигателей и главного редуктора, генераторы ГТ40ПЧ6, гидронасосы НП-92А-4 и компрессор АК-50Т1.</p><ul><li><b>Вентиляторная установка</b> — одноступенчатый осевой вентилятор, 6000 об/мин: корпус, кок с дроссельным устройством, направляющий аппарат, рабочее колесо, спрямляющий аппарат, кожух карданного вала.</li><li><b>Три потока.</b> Через шп. 1 капота на радиаторы и за капот. От четырёх патрубков — к двум гидронасосам, компрессору и четвёртой опоре каждого двигателя. От большого патрубка — к дополнительным радиаторам главного редуктора слева.</li><li><b>Генераторы</b> и коробку приводов охлаждает центробежный вентилятор на ней: воздух берётся из хвостовой части фюзеляжа, нагретый — за борт.</li><li><b>Гибкие трубопроводы</b> — проволочный каркас в оболочке из стеклоткани.</li><li><b>Зимой</b> окна дроссельного устройства открыты, производительность меньше.</li></ul><h2>Крепление двигателей</h2><ul><li>Двигатели на потолочной панели, симметрично, 600 мм друг от друга, наклон вперёд вниз 4°30′ к строительной горизонтали — для минимального сопротивления на крейсерской скорости.</li><li>Спереди: силовое кольцо на корпусе первой опоры, четыре тяги к потолочной панели у шп. 6Н. Воспринимают только крутящий момент.</li><li>Сзади: сферическая опора главного редуктора. Воспринимает осевые силы.</li><li>Валы подключены к ВР-24 через муфты свободного хода.</li></ul><h2>ПЗУ</h2><ul><li>Инерционного типа, две ступени, очистка 70–75 %. Состав: обтекатель («гриб»), сепаратор, эжектор, трубопровод отвода пыли, противообледенительная система.</li><li><b>Первая ступень</b> — на обтекателе: центробежная сила прижимает пыль к его задней стенке.</li><li><b>Вторая</b> — в кольцах сепаратора: при повороте потока пыль отделяется, уходит в трубу и эжектором выбрасывается за борт.</li><li>Воздух на эжектор — из-за XII ступени компрессора. Включение — выключатель ПЗУ — ОТКЛ. под колпаком, табло ПЗУ ЛЕВ. (ПРАВ.) ДВИГ. ВКЛЮЧЕН.</li></ul><h2>ЭВУ</h2><ul><li>Снижает тепловое излучение — защита от ракет с инфракрасными головками.</li><li>Внутренний контур из титанового сплава: три изогнутых канала для газов. Наружный контур: холодный воздух, изнутри оклеен фольгой.</li><li>Холодный воздух засасывается за счёт эжекции, охлаждает стенки каналов и смешивается с газами через отверстия в концевом шпангоуте.</li><li>Подвеска: две тяги сверху, пилон снизу; откидывается для обслуживания.</li></ul><p class="note">По книге, разделы 7.6 и 7.7. Расположение агрегатов на схеме условное.</p>'};
})();

const DARK = '#39494b', CAST = '#839997', STEEL = '#b8cbc6', BOLT = '#d0d8ca';
function axisHousing(center, direction, radius, length, tint=CAST) {
  const d = nrm(direction);
  lathe(center,d,[[-.55*length,.60*radius],[-.44*length,.88*radius],[-.39*length,radius],[-.29*length,radius],[.29*length,.90*radius],[.36*length,radius],[.46*length,radius],[.52*length,.62*radius]],tint,1,14);
  for(const v of [-.40,.39]) {
    const flange = center.map((q,i)=>q+d[i]*v*length);
    for(const p of circ(flange,d,radius*.85,6)) {
      const q = p.map((x,i)=>x+d[i]*(v<0?-.016:.016));
      cyl(p,q,radius*.065,BOLT,1,5);
    }
  }
}
function shaft(a,b,r,col=STEEL) {
  cyl(a,b,r,col,1,10);
  for(const t of [0,.94]) cyl(along(a,b,t),along(a,b,t+.06),r*1.63,DARK,1,12);
}
function ribbedBox(c,s,col) {
  rbox(c,s,col,1);
  for(let i=-2;i<=2;i++) {
    box([c[0]+i*s[0]*.14,c[1]+s[1]*.34,c[2]], [s[0]*.05,s[1]*.35,s[2]*.92],STEEL,.9);
  }
}
function gearboxSection(){
  const up=[0,1,0], [x,y,z]=MAIN;
  const profile=[[-.57,.22],[-.49,.34],[-.29,.35],[-.24,.39],[.12,.49],[.16,.53],[.20,.49],[.37,.36],[.46,.17],[.49,.15]];
  const pos=(h,r,a)=>[x+r*Math.cos(a),y+h,z+r*Math.sin(a)];
  for(let row=1;row<profile.length;row++){
    const [h0,r0]=profile[row-1], [h1,r1]=profile[row];
    for(let k=0;k<18;k++){
      const a=Math.PI+k*Math.PI/18,b=a+Math.PI/18;
      for(const wall of [0,.032])poly([pos(h0,r0-wall,a),pos(h0,r0-wall,b),pos(h1,r1-wall,b),pos(h1,r1-wall,a)],shade(wall?'#536462':'#81928b',.79+.20*Math.cos(a)),1,null);
    }
    for(const a of [0,Math.PI])poly([pos(h0,r0,a),pos(h0,r0-.032,a),pos(h1,r1-.032,a),pos(h1,r1,a)],'#d29569',1,null);
  }
  cyl(pos(-.53,0,0),MODEL_LAYOUT.mainRotorFoot,.07,STEEL,1,14);
  for(const [h,r,color] of [[-.32,.265,'#9faea4'],[-.04,.33,'#91a39c'],[.22,.30,'#a9b5aa']]){
    const contour=height=>Array.from({length:72},(_,i)=>pos(height,r*(i%4===1||i%4===2?1:.91),Math.PI*i/36));
    loft([contour(h-.031),contour(h+.031)],color,1,{stroke:null});
    lathe(pos(h,0,0),up,[[.032,r*.53],[.049,r*.53],[.058,r*.34]],STEEL,1,18);
  }
}
