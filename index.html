  // Радиусы заданы в масштабе корпуса. Профили сечений нужны для учебного изображения.
  function blade(origin, radial, tangent, axis, pitch, tail, cut) {
    const end = tail ? tailRadius : mainRadius;
    const root = tail ? .39 : .84;
    const chord = tail ? .24 : .62;
    const sweep = tail ? .08 : 0;
    const coords = (r, x, z) => {
      const fraction = (r-root)/(end-root);
      const a = pitch-(tail?.10:.13)*fraction;
      return at(origin,radial,tangent,axis,r,x*Math.cos(a)-z*Math.sin(a)+sweep*fraction,
        x*Math.sin(a)+z*Math.cos(a));
    };
    const stations = tail
      ? [[root,.42],[.48,.49],[.61,.91],[.69,1],[1.71,1],[1.83,.95],[1.90,.81],[end,.68]]
      : [[root,.29],[1.04,.38],[1.20,.65],[1.46,.94],[1.60,1],[7.95,1],[8.43,.98],[8.54,.89],[end,.77]];
    const skin = [[.50,0],[.38,.036],[.14,.081],[-.17,.077],[-.47,.031],[-.51,0],[-.36,-.028],[.12,-.041],[.38,-.027]];
    const sections = stations.map(([r,s])=>skin.map(([x,z])=>coords(r,x*s*chord,z*s*chord)));
    if(!cut) {
      loft(sections,tail?tailColor:mainColor,1,{cols:stations.slice(1).map((_,i)=>
        i===stations.length-2?'#b8c1b8':i===0?dark:tail?tailColor:mainColor)});
    } else {
      const spar = [[.48,0],[.37,.06],[.04,.073],[-.13,.045],[-.13,-.025],[.31,-.041]];
      loft(stations.map(([r,s])=>spar.map(([x,z])=>coords(r,x*s*chord,z*s*chord))),
        '#71ad9d',1);
      const cells = tail?6:15;
      const min = tail?.54:1.43, max = tail?1.82:8.34;
      for(let i=0;i<cells;i++){
        const a=min+(max-min)*i/cells, b=min+(max-min)*(i+1)/cells;
        poly([coords(a,-.16*chord,-.025*chord),coords(b-.025,-.16*chord,-.025*chord),
          coords(b-.025,-.47*chord,-.014*chord),coords(a,-.47*chord,-.014*chord)],
          i%2?'#be9b69':'#d8b67a',1,'#866b49',.005);
        poly([coords(a,-.16*chord,-.025*chord),coords(a,-.47*chord,-.014*chord),
          coords(a,-.47*chord,.01*chord),coords(a,-.16*chord,.04*chord)],light,1);
      }
    }
    const strips = tail?1:4;
    for(let i=0;i<strips;i++){
      const start=(tail?.68:1.60)+(end-(tail?.72:1.67))*i/strips;
      const finish=(tail?.68:1.60)+(end-(tail?.72:1.67))*(i+1)/strips-.012;
      poly([coords(start,.27*chord,.071*chord),coords(finish,.27*chord,.071*chord),
        coords(finish,.37*chord,.058*chord),coords(start,.37*chord,.058*chord)],
        cut?heatColor:'#9ba59c',1,null,.012);
    }
  }
  function disk(origin,axis,offset,radius,thickness,color) {

  function hubCasting(){
    const Y=mainAxis, O=mainHub, cast='#84918c', steel='#bec7c4', boot='#323a3d', brass='#a59370';
 const drum=(p,axis,profile,color,n=14)=>lathe(p,axis,profile,color,1,n);
 drum(O,Y,[[-.66,.105],[-.6,.14],[-.19,.14],[-.15,.23],[-.08,.26],[.075,.26],[.11,.215],[.13,.17]],cast,20);
 drum(O,Y,[[.105,.169],[.13,.175],[.148,.14],[.179,.14],[.19,.119]],steel,12);
 drum(O,Y,[[.182,.11],[.20,.116],[.213,.09],[.216,.04]],cast);
 for(let i=0;i<5;i++){
  const [r,u]=frameFor(Y,mainAngle+i*turn/5);

  // Выпуклые наружные кромки и открытые окна в литых рамках.
  function beam(rows,color){
   const ring=[[1,.65],[.76,1],[-.76,1],[-1,.65],[-1,-.65],[-.76,-1],[.76,-1],[1,-.65]];
   loft(rows.map(([x,y,z,w,h])=>ring.map(([s,t])=>p(x,y+s*w,z+t*h))),color,1);
  }
  const bolt=(x,y,h,rad=.033)=>{
   drum(p(x,y,h),Y,[[0,rad*1.25],[.008,rad*1.25]],steel,10);
   drum(p(x,y,h+.008),Y,[[0,rad],[.016,rad],[.02,rad*.87]],brass,6);
  };
  for(const sign of [-1,1])beam([[.15,sign*.099,0,.08,.079],[.245,sign*.138,0,.07,.07],[.34,sign*.196,0,.043,.053],[.47,sign*.207,0,.039,.049],[.55,sign*.186,0,.047,.055],[.62,sign*.137,0,.058,.065],[.64,sign*.084,0,.061,.064]],cast);
  beam([[.565,0,0,.13,.049],[.60,0,0,.17,.069],[.66,0,0,.14,.065]],cast);
  drum(p(.365),r,[[0,.052],[.025,.077],[.065,.095],[.106,.099],[.14,.089],[.155,.075]],boot);
  for(let k=0;k<6;k++){
   let x=.39+k*.018; const rad=.075+.023*Math.sin(Math.PI*(k+1)/8);
   drum(p(x),r,[[0,rad],[.005,rad+.003],[.008,rad]],'#83908c',10);
  }
  drum(p(.45),r,[[0,.054],[.21,.055],[.225,.08],[.26,.082],[.276,.071],[.34,.068]],steel);
  for(const h of [-.054,.054])beam([[.723,0,h,.065,.027],[.78,0,h,.09,.033],[.91,0,h,.113,.031],[.99,0,h,.094,.029],[1.015,0,h,.074,.025]],cast);
  bolt(.925,.061,.086);bolt(.925,-.061,.086);
  const left=p(.48,-.212,.043), right=p(.91,-.235,.024);
  const axis=nrm(sub3(right,left)), L=Math.hypot(...sub3(right,left));
  drum(left,axis,[[0,.027],[.052,.032],[.07,.047],[.084,.05],[.24,.046],[.25,.053],[.268,.052],[.276,.022],[L,.021]],steel);
  beam([[.85,-.09,.006,.04,.032],[.9,-.16,.009,.044,.03],[.92,-.225,.016,.038,.03]],cast);
  bolt(.91,-.235,.045,.023);bolt(.48,-.212,.06,.022);
  beam([[.69,.052,-.025,.038,.038],[.70,.13,-.045,.041,.03],[.65,.218,-.062,.039,.025]],cast);
    bolt(.19,0,.095,.027);
    cyl(p(.12,0,.27),p(.64,0,.27),.023,dark,1,8);
    cyl(p(.63,0,.27),p(.80,0,.27),.062,metal,1,10);
   }
   disk(mainHub,mainAxis,.25,.13,.09,dark);

  function swashplate(t,motion){
    const wave=Math.sin(t*2);
    const lift=motion==='collective'?.07*wave:0;
    const pivot=add(mainHub,mainAxis,-.40+lift);
    const normal=motion==='cyclic'?nrm(add(mainAxis,[1,0,0],-.21*wave)):mainAxis;
    const point=(angle,radius,h)=>{
      const [r,u]=frameFor(normal,angle);
      return at(pivot,r,u,normal,radius,0,h);
    };
    lathe(mainFoot,mainAxis,[[0,.17],[.03,.18],[.05,.135],[.47,.135]],dark,1,20);
    lathe(pivot,mainAxis,[[-.15,.15],[-.12,.17],[.035,.17],[.05,.15]],light,1,20);
    for(const [rad,h,w,c] of [[.215,-.018,.034,metal],[.283,-.022,.031,dark],[.34,0,.036,'#849e9e'],[.34,.048,.032,light]])
      annulus(add(pivot,normal,h),normal,rad,w,c);
    for(let i=0;i<5;i++){
      const angle=mainAngle+i*turn/5,[r,u]=frameFor(mainAxis,angle);
      const pin=point(angle+.38,.43,.045);
      const elbow=at(mainHub,r,u,mainAxis,.65,.216,-.064);
      cyl(point(angle+.38,.31,.046),pin,.036,metal,1,9);
      cyl(pin,elbow,.019,light,1,9);
      cyl(add(pin,sub3(elbow,pin),.22),add(pin,sub3(elbow,pin),.70),.028,metal,1,8);
      cyl(add(pin,u,-.032),add(pin,u,.032),.033,dark,1,10);
    }
    for(let i=0;i<4;i++){
      const angle=i*Math.PI/2;
      cyl(point(angle,.15,-.018),point(angle,.29,-.018),.032,metal,1,10);
      if(i<3){
        const foot=at(mainFoot,...frameFor(mainAxis,angle),mainAxis,.43,0,.035);
        const hinge=point(angle,.39,-.082);
        cyl(point(angle,.27,-.026),hinge,.034,metal,1,9);
        cyl(foot,hinge,.026,light,1,9);
      }
    }
  }
  function mainHead(detailed,t,motion){
    if(detailed){hubCasting();swashplate(t,motion);return;}
    lathe(mainHub,mainAxis,[[-.73,.12],[-.16,.12],[-.12,.23],[.08,.24],[.17,.14]],metal,1,16);
    for(let i=0;i<5;i++){
      const [r,u]=frameFor(mainAxis,mainAngle+i*turn/5);
      for(const side of [-1,1])
        tube([[.14,.08],[.42,.18],[.64,.12],[.93,.06]].map(([d,w])=>at(mainHub,r,u,mainAxis,d,side*w)),.043,metal,1,6);
    }
  }
  function drawMain(t, motion, detail, cut) {
    if(!cut){
      if(motion)swashplate(t,motion);
      else mainHead(detail,t,motion);
    }
    const v=Math.sin(t*2);
    for(let i=0;i<(cut?1:5);i++) {
      const a=mainAngle+i*turn/5;
      const angle=motion==='collective'?.19*v:motion==='cyclic'?.20*v*Math.cos(a):0;
      blade(mainHub,...frameFor(mainAxis,a),mainAxis,angle,false,cut);
    }
  }
  function drawTail(t, motion, detailed, cut) {
    if(!cut){
      cyl(tailMount,add(tailHub,tailAxis,.23),.10,dark,1,12);
      lathe(tailHub,tailAxis,[[-.22,.16],[-.14,.21],[.09,.21],[.18,.13]],metal,1,16);
      disk(tailHub,tailAxis,.21,.135,.06,light);
    }
    const displacement=motion==='tail'?.09*Math.sin(t*2):0;
    if(detailed&&!cut){
      lathe(tailHub,tailAxis,[[.07,.13],[.11,.145],[.135,.13],[.15,.091],[.25,.087],[.28,.064]],metal,1,20);
      lathe(add(tailHub,tailAxis,displacement),tailAxis,[[.255,.075],[.27,.116],[.31,.116],[.326,.082],[.344,.052]],light,1,18);
    }
    for(let i=0;i<(cut?1:4);i++){
      const b=i%2, a=tailAngle+b*tailStagger+(i>=2?Math.PI:0);
      const origin=add(tailHub,tailAxis,b?.09:-.09);
      const [r,u]=frameFor(tailAxis,a);
      const q=(d,s=0,h=0)=>at(origin,r,u,tailAxis,d,s,h);
      if(!cut){
        const pitch=motion==='tail'?displacement*2.6:0;
        const grip=(d,t,h)=>q(d,t*Math.cos(pitch)-h*Math.sin(pitch),t*Math.sin(pitch)+h*Math.cos(pitch));
        const shoe=(d,w,h,z)=>[[-1,-.65],[-.8,-1],[.8,-1],[1,-.65],[1,.65],[.8,1],[-.8,1],[-1,.65]].map(([x,y])=>grip(d,w*x,z+y*h));
        for(const side of [-1,1])
          cyl(q(.035,side*.042),q(.31,side*.042),.026,metal,1,8);
        lathe(q(.10),r,[[0,.061],[.025,.071],[.056,.069],[.065,.049],[.20,.046],[.22,.06]],b?metal:light,1,12);
        for(const side of [-1,1])
          loft([shoe(.30,.048,.016,side*.026),shoe(.39,.075,.016,side*.028),shoe(.48,.079,.013,side*.028)],metal,1);
        for(const [d,w] of [[.395,0],[.45,-.046],[.45,.046]])
          cyl(grip(d,w,-.047),grip(d,w,.048),.016,light,1,8);
        if(detailed){
          const elbow=grip(.27,.108,.028);
          cyl(grip(.29,.038,0),elbow,.025,metal,1,8);
          cyl(q(.07,.065,.29+(b?-.09:.09)+displacement),elbow,.015,light,1,9);
        }
      }
      blade(origin,r,u,tailAxis,motion==='tail'?displacement*2.6:0,true,cut);
    }
  }

  const tg=t?xfT(invT(t),[1.95,1.5,0]):[1.95,1.5,0];
  return {tg,yaw:-.28,pitch:.29,zoom:DD*(t?t.s[0]:1)/(BASE*30.5)};
}
function setExterior(on){
  if(exterior===on)return;
  if(on){
    insideView={tg:VT.tg.slice(),yaw:VT.yaw,pitch:VT.pitch,zoom:VT.zoom};
    insideSheet=shState;
    const prev=CUR;
    CUR=[];
    XF=SYS.T?invT(SYS.T):null;
    if(SYS.exterior)SYS.exterior();else shell();
    XF=null;
    exteriorMesh=CUR;
    CUR=prev;
    fly(outsideView());
  }else{
    fly(insideView);
    setSheet(insideSheet);
    exteriorMesh=[];
  }
  exterior=on;
  stage.classList.toggle('exterior',on);
  $('hullOutside').setAttribute('aria-pressed',String(on));
  $('hullInside').setAttribute('aria-pressed',String(!on));
}
$('hullOutside').onclick=()=>setExterior(true);
$('hullInside').onclick=()=>setExterior(false);

showOv(s.t,s.txt+'<div class="prog"><i style="width:'+((i+1)/SYS.steps.length*100)+'%"></i></div>',true);$('ovC').textContent=(i+1)+' из '+SYS.steps.length;$('prev').disabled=i===0;$('next').disabled=i===SYS.steps.length-1;document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('on',+b.dataset.step===i));}

/* quiz on the scheme */
let score=[0,0];const qname=c=>c.q||c.n;
const quizAns=()=>quiz.type==='num'?quiz.q[1]:qname(quiz.c);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function nextQ(){const pool=[];const seen=new Set();for(const c of SYS.comps){if(c.detail&&!vis(c))continue;if(seen.has(qname(c)))continue;seen.add(qname(c));pool.push(c);}const c=pool[Math.random()*pool.length|0];const types=SYS.qs?['name','find','num','num']:['name','find'];const type=types[Math.random()*types.length|0];quiz={c,type,done:false};const sc='<div class="sm">Счёт: '+score[0]+' из '+score[1]+'</div>';
const opt=o=>'<button class="bt li" data-ans="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>';
if(type==='num'){const q=SYS.qs[Math.random()*SYS.qs.length|0];quiz.q=q;sel=null;HL=null;showOv(q[0]+'?','<div id="qz">'+sc+'<div class="col">'+shuffle(q.slice(1,5)).map(opt).join('')+'</div><div id="qr"></div></div>',false);}
else if(type==='name'){focus(c.n);const opts=[c];while(opts.length<Math.min(4,pool.length)){const o=pool[Math.random()*pool.length|0];if(!opts.includes(o))opts.push(o);}showOv('Что подсвечено на схеме?','<div id="qz">'+sc+'<div class="col">'+shuffle(opts).map(o=>opt(qname(o))).join('')+'</div><div id="qr"></div></div>',false);}
else{sel=null;HL=null;fly(SYS.view);showOv('Покажи на схеме: '+qname(c),'<div id="qz"><div class="sm">Счёт: '+score[0]+' из '+score[1]+'. Нажми на этот агрегат на схеме.</div><div id="qr"></div></div>',false);setSheet('min');}
if(type!=='find'&&shState==='min')setSheet('mid');}
function answer(ok,picked){if(!quiz||quiz.done)return;quiz.done=true;score[1]++;if(ok)score[0]++;const right=quizAns();document.querySelectorAll('[data-ans]').forEach(b=>{b.disabled=true;if(b.dataset.ans===right)b.classList.add('ok');else if(picked&&b===picked)b.classList.add('no');});
if(quiz.type==='find')setSheet('mid');
if(quiz.type==='num'){$('qr').innerHTML='<div class="'+(ok?'okT':'badT')+'">'+(ok?'Верно.':'Неверно. Правильный ответ: '+right+'.')+'</div>'+(quiz.q[5]?'<p class="note">'+quiz.q[5]+'</p>':'')+'<button class="bt on" id="qn" style="margin-top:10px;width:100%">Следующий вопрос</button>';return;}
const c=quiz.c;focus(c.n);$('qr').innerHTML='<div class="'+(ok?'okT':'badT')+'">'+(ok?'Верно.':'Неверно. Это «'+qname(c)+'» — он подсвечен на схеме.')+'</div><div class="sm" style="margin:6px 0 10px">'+c.i+'</div><button class="bt on" id="qn" style="width:100%">Следующий вопрос</button>';}
$('ov').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!quiz)return;if(b.dataset.ans!=null)answer(b.dataset.ans===quizAns(),b);else if(b.id==='qn')nextQ();});

/* ---------- ЦИФРЫ: ТТХ, ЛТХ, особые случаи (из vk2500, см. numq.js) и цифры систем ---------- */
const NUM=(function(){
const root=$('numRoot');
/* все вопросы с цифрами: [вопрос, верный, неверный×3] из SYSS.<id>.qs */
/* разделы: главное = ТТХ + ЛТХ + особые случаи */
const GR=[['main','Главное'],['tth','ТТХ'],['ltx','ЛТХ'],['osob','Особые случаи'],['sys','Системы'],['other','Остальное'],['all','Все']];
const GCOL={tth:'#5aa9ff',ltx:'#3ccf7a',osob:'#ff5a4e',sys:'#f2b01e',other:'#8fa3a5'};
const inG=(x,g)=>g==='all'||(g==='main'?['tth','ltx','osob'].includes(x.g):x.g===g);
const Q=[];const seenQ=new Set();
for(const[id]of SYSLIST){if(id==='all'||!SYSS[id]||!SYSS[id].qs)continue;for(const q of SYSS[id].qs){if(seenQ.has(q[0]))continue;seenQ.add(q[0]);Q.push({g:'sys',cat:sysInfo(id)[1],col:sysInfo(id)[2],q:q[0],a:q[1],w:q.slice(2,5),src:q[5],k:id+'|'+q[0]});}}
if(typeof NUMQ_EXT!=='undefined')for(const x of NUMQ_EXT){if(seenQ.has(x.q))continue;seenQ.add(x.q);Q.push({g:x.g,cat:x.c,col:GCOL[x.g],q:x.q,a:x.a,w:x.o,src:x.s,k:'x|'+x.q});}
/* разбор чисел: «3–4» → [3,4], «100 ± 5» → [100,5], «−60» → [-60], «1 650» → [1650] */
function nums(s){s=String(s).replace(/(\d)[\s  ](?=\d{3}(\D|$))/g,'$1');const out=[];const re=/(\d+(?:[.,]\d+)?)/g;let m;while((m=re.exec(s))){let v=parseFloat(m[1].replace(',','.'));const i=m.index,pc=s[i-1],pp=s[i-2];if((pc==='-'||pc==='−')&&(i<2||/[\s(:]/.test(pp)))v=-v;out.push(v);}return out;}
const WN={'ноль':0,'один':1,'одна':1,'одно':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12};
const WRE=new RegExp('(^|[^а-яё])('+Object.keys(WN).join('|')+')(?=[^а-яё]|$)','gi');
const wordsToDigits=a=>/\d/.test(a)?a:a.replace(WRE,(m,p,w)=>p+WN[w.toLowerCase()]);
const shape=a=>wordsToDigits(a).replace(/[−-]?\d+(?:[.,]\d+)?/g,'□');
/* только вопросы, где ответ — число; для ввода — без марок и номеров (АМГ-10, № 6–9, 12-й) */
for(let i=Q.length-1;i>=0;i--){const a=wordsToDigits(Q[i].a);if(!nums(a).length){Q.splice(i,1);continue;}Q[i].inp=!/[A-Za-zА-Яа-яЁё]-?\d|\d-?[йяе](?![а-яё])|\d[A-Za-zА-Яа-я]\d|№|:|[IVX]{2,}/.test(Q[i].a);}
const eq=(a,b)=>a.length===b.length&&a.every((v,i)=>Math.abs(v-b[i])<1e-9);
/* состояние */
let S=store.get('num',{});const save=()=>store.set('num',S);
let G=store.get('numG','main'),C=store.get('numC','all'),M=store.get('numM','choice'),cur=null,recent=[],retry=[],streak=0,today={ok:0,n:0},typed='';
const pool=()=>Q.filter(x=>inG(x,G)&&(C==='all'||x.cat===C)&&(M==='choice'||x.inp));
const st=k=>S[k]||{b:0,n:0,w:0};
function weight(x){const s=st(x.k);if(!s.n)return 3;if(s.b===0)return 6;return [6,3,2,1,.4,.25][Math.min(s.b,5)];}
function pick(){const P=pool();if(!P.length)return null;
for(let i=0;i<retry.length;i++){if(--retry[i].d<=0){const r=retry.splice(i,1)[0];const x=P.find(y=>y.k===r.k);if(x)return x;}}
const cand=P.filter(x=>!recent.includes(x.k));const C=cand.length?cand:P;let sum=0;for(const x of C)sum+=weight(x);let r=Math.random()*sum;for(const x of C){r-=weight(x);if(r<=0)return x;}return C[C.length-1];}
function grade(ok){const s=st(cur.k);s.n++;if(ok){s.b=Math.min(5,s.b+1);streak++;today.ok++;}else{s.b=0;s.w++;streak=0;retry.push({k:cur.k,d:3});}today.n++;S[cur.k]=s;save();recent.push(cur.k);if(recent.length>6)recent.shift();}
const known=()=>{const P=pool();return [P.filter(x=>st(x.k).b>=3).length,P.length];};
const cnt=n=>' <span style="opacity:.55;font-weight:500">'+n+'</span>';
function chipsHTML(){const okM=x=>M==='choice'||x.inp;let h='<div class="chips">'+GR.map(([id,n])=>'<button class="chip'+(G===id?' on':'')+'" data-ng="'+id+'">'+n+cnt(Q.filter(x=>inG(x,id)&&okM(x)).length)+'</button>').join('')+'</div>';
if(!['main','all'].includes(G)){const cats=[...new Set(Q.filter(x=>inG(x,G)&&okM(x)).map(x=>x.cat))];
h+='<div class="chips" style="margin-top:8px">'+['all'].concat(cats).map(c=>'<button class="chip sub'+(C===c?' on':'')+'" data-nc="'+c.replace(/"/g,'&quot;')+'">'+(c==='all'?'Все темы':c)+cnt(Q.filter(x=>inG(x,G)&&okM(x)&&(c==='all'||x.cat===c)).length)+'</button>').join('')+'</div>';}
return h;}
function statsHTML(){const[k,t]=known();return '<div><b>'+streak+'</b><span>подряд верно</span></div><div><b>'+today.ok+'<span style="font-size:14px;color:var(--ink3)"> / '+today.n+'</span></b><span>за сеанс</span></div><div><b>'+k+'<span style="font-size:14px;color:var(--ink3)"> / '+t+'</span></b><span>выучено</span></div>';}
function head(){return '<div class="top" style="padding-left:0;padding-right:0"><div class="h1" style="margin:0">Цифры</div></div>'+

'<div class="nstat" id="numStats" style="margin-top:12px">'+statsHTML()+'</div>';}
function render(){if(!cur){const p=pick();cur=p?Object.assign({},p):null;typed='';}

const gn=GR.find(g=>g[0]===cur.g)[1];let h=head()+'<div class="qcard"><div class="qsys"><i class="dot" style="background:'+cur.col+'"></i>'+gn+(cur.cat!==gn?' · '+cur.cat:'')+'</div><div class="qtext">'+cur.q+'?</div><div id="qa"></div></div>'+weakHTML();
root.innerHTML=h;
for(const chip of root.querySelectorAll('.chips .chip.on')){
  const strip=chip.parentElement;
  const right=chip.getBoundingClientRect().right-strip.getBoundingClientRect().right;
  if(right>0)strip.scrollLeft+=right+14;
}
M==='choice'?renderChoice():renderInput();}
function renderChoice(){const opts=shuffle([cur.a].concat(cur.w));$('qa').innerHTML='<div class="opts">'+opts.map((o,i)=>'<button class="opt" data-o="'+o.replace(/"/g,'&quot;')+'"><span class="k">'+'АБВГ'[i]+'</span><span>'+o+'</span></button>').join('')+'</div><div id="fb"></div>';}
function renderInput(){const sh=shape(cur.a);$('qa').innerHTML='<div class="inp"><input id="ni" inputmode="none" autocomplete="off" placeholder="Набери цифры" value="'+typed+'"></div><div class="unit">Формат ответа: <b style="color:var(--ink2)">'+sh+'</b></div>'+
'<div class="kp" id="kp">'+['1','2','3','⌫','4','5','6','–','7','8','9',',','−','0'].map(k=>'<button data-k="'+k+'">'+(k==='–'?'–<small>до, ±</small>':k==='−'?'−<small>минус</small>':k)+'</button>').join('')+'<button data-k="ok" class="go">Проверить</button></div>'+
'<div class="acts" style="margin-top:8px"><button class="bt" id="idk" style="min-height:44px;background:none;border-color:transparent;color:var(--ink3)">Не знаю — показать ответ</button></div><div id="fb"></div>';
const ni=$('ni');ni.addEventListener('input',()=>{typed=ni.value;});ni.addEventListener('keydown',e=>{if(e.key==='Enter')checkInput();});}
function finish(ok,html){$('numStats').innerHTML=statsHTML();$('fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+html+(cur.src?'<div style="font-size:12.5px;opacity:.7;margin-top:6px">Источник: '+cur.src+'</div>':'')+'</div><div class="acts"><button class="bt on" id="nx">Следующий вопрос</button></div>';const n=$('nx');n.scrollIntoView({block:'nearest',behavior:'smooth'});}
function checkInput(){if(cur.done)return;const ni=$('ni');const u=nums(ni.value),r=nums(wordsToDigits(cur.a));if(!u.length){ni.focus();return;}cur.done=true;const ok=eq(u,r);const part=!ok&&u.length<r.length&&eq(u,r.slice(0,u.length));grade(ok);
ni.classList.add(ok?'ok':'no');ni.readOnly=true;$('kp').classList.add('hide');$('idk').parentNode.classList.add('hide');
finish(ok,ok?'<b>Верно!</b> '+cur.a:(part?'<b>Почти.</b> Полный ответ: <b>'+cur.a+'</b>':'<b>Неверно.</b> Правильно: <b>'+cur.a+'</b>'));}
function weakHTML(){const P=pool().filter(x=>st(x.k).w>0).sort((a,b)=>st(b.k).w-st(a.k).w||st(a.k).b-st(b.k).b).slice(0,5);if(!P.length)return '';

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

else if(b.dataset.k){const ni=$('ni');if(cur.done)return;const k=b.dataset.k;if(k==='ok')return checkInput();if(k==='⌫')ni.value=ni.value.slice(0,-1);else if(k==='–')ni.value+=(ni.value&&!/[\s–]$/.test(ni.value)?'–':'');else if(k==='−')ni.value+=(!ni.value||/[\s–]$/.test(ni.value)?'−':'');else ni.value+=k;typed=ni.value;}

})();
